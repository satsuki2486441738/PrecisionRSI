name: Publish precision history
on:
  push:
    branches: [main]
    paths: ['community/**', '.github/workflows/pages.yml', 'precision_maintenance/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -B -m community.records validate
      - name: Keep published history append-only
        env:
          BEFORE: ${{ github.event.before }}
        run: python -B -m precision_maintenance validate-immutability --ci
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: community/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
