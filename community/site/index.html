  .dw-pair{grid-template-columns:1fr;gap:6px}
  .dp-vs{display:none}
}

/* ---------- tooltip ---------- */
.tip{position:fixed;z-index:90;pointer-events:none;max-width:320px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);box-shadow:0 12px 40px -12px rgba(20,15,15,.3);font-size:12px;line-height:1.55;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{display:block;font-size:12.5px;font-weight:500}
.tip .tm{font:10.5px var(--mono);color:var(--faint);margin-top:3px}
.tip .tv{font:500 13px var(--mono);margin-top:6px}

/* ---------- swarm ---------- */
.figbox{padding:16px 16px 8px}
.figbox svg{display:block;width:100%;height:auto;overflow:visible}
.sw-pt{cursor:pointer;transition:opacity .15s}
.sw-pt.dim{opacity:.07}
.sw-pt.hot{stroke:var(--ink);stroke-width:1.5}
.ax{fill:var(--faint);font:9.5px var(--mono)}
.ax-col{fill:var(--ink);font:500 11px var(--display)}
.ax-sub{fill:var(--faint);font:9px var(--mono)}
.gridl{stroke:var(--hair);stroke-width:1}
.sepl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:14px;font:10.5px var(--mono);color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:7px}
.fig-filters{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:14px}
.fig-filters .facet-l{line-height:30px;margin-right:2px}

/* ---------- group cards (2-column showcase + Lightbound-style structured rows) ---------- */
.gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.gcard{display:flex;flex-direction:column;overflow:hidden;transition:border-color .18s,box-shadow .18s}
.gcard:hover{border-color:var(--ink);box-shadow:0 12px 32px -22px rgba(20,15,15,.28)}
.ghead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:18px 20px 14px}
.gh-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ghead h3{font-size:16px;font-weight:500;letter-spacing:-.02em;line-height:1.3}
.gh-stat{font:10.5px/1.4 var(--mono);color:var(--faint);white-space:nowrap}
.gh-stat b{font-weight:500;color:var(--ink)}
.ghead .gans{font:11.5px/1.55 var(--mono);color:var(--muted);margin-top:5px}
.ghead .gans b{font-weight:500;color:var(--red)}
.spark{display:flex;gap:2px;height:5px;margin:0 20px 14px;border-radius:2px;overflow:hidden}
.spark i{display:block}
.grank{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 20px;background:var(--wash);border-top:1px solid var(--hair);font:500 10px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.grank b{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.gtop li{border-top:1px solid var(--hair)}
.gtop button{display:grid;grid-template-columns:18px minmax(0,1fr) auto 58px;gap:10px;align-items:center;width:100%;padding:10px 20px;text-align:left;transition:background .1s}
.gtop button:hover{background:var(--wash)}
.gtop .rk{font:10.5px var(--mono);color:var(--faint)}
.gtop .tt{min-width:0}
.gp-line{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;line-height:19px;white-space:nowrap;overflow:hidden}
.gp-line>.dot{flex:none}
.gp-p{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;min-width:0}
.gp-vs{font:11px var(--mono);color:var(--faint);flex:none}
.gp-ref{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gp-sub{display:block;margin-top:2px;font:10.5px/15px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gdots{display:inline-flex;gap:3px;align-items:center}
.gdots i{width:5px;height:5px;border-radius:50%;background:var(--hair)}
.gdots i.on{background:var(--mc,var(--ink))}
.gdots i.z{border-radius:1px;transform:rotate(45deg);background:var(--t0)}
.gtop .v{font:500 12.5px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.gmore{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:auto;padding:12px 20px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--muted);transition:color .15s,background .15s}
.gmore span{color:var(--red)}
.gmore:hover{background:var(--wash);color:var(--ink)}
@media (min-width:861px){
  .gcard.wide .g-right{display:flex;flex-direction:column}
  .gcard.wide .grank{border-top:0}
}

/* ---------- coverage cloud ---------- */
.cloud{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:28px 20px}
.ptile{--pc:var(--p-cpu);display:inline-flex;align-items:center;gap:10px;border:1px solid color-mix(in srgb,var(--pc) 40%,var(--line));background:color-mix(in srgb,var(--pc) 7%,var(--paper));border-radius:999px;padding:7px 16px;font-weight:500;letter-spacing:-.01em;color:var(--ink);transition:transform .15s,border-color .15s,background .15s}
.ptile:hover{transform:translateY(-1px);border-color:var(--pc)}
.ptile .n{font:11px var(--mono);font-weight:400;color:var(--muted);padding-left:10px;border-left:1px solid var(--line)}
.ptile.s{font-size:12.5px;padding:5px 12px}
.ptile.m{font-size:15px}
.ptile.l{font-size:19px;padding:9px 20px}
.ptile[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:#fff}
.ptile[aria-pressed="true"] .n{color:#ffffffcc;border-left-color:#ffffff55}
.ptile.acc{--pc:var(--p-acc)} .ptile.gpu{--pc:var(--p-gpu)} .ptile.cpu{--pc:var(--p-cpu)}
.cloud-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;padding:14px;border-top:1px solid var(--hair);font:11px var(--mono);color:var(--muted)}
.cloud-legend b{color:var(--ink);font-weight:500;margin-right:4px}

/* ---------- recent ---------- */
.recent li+li{border-top:1px solid var(--hair)}
.recent button{display:grid;grid-template-columns:92px minmax(0,1fr) auto auto;gap:16px;align-items:center;width:100%;padding:14px 20px;text-align:left}
.recent button:hover{background:var(--wash)}
.recent .d{font:11px var(--mono);color:var(--faint)}
.recent b{display:block;font-size:14px;font-weight:500}
.recent small{display:block;font:10.5px var(--mono);color:var(--faint);margin-top:2px}
.recent .rv{text-align:right;font:500 13px var(--mono)}
.recent .rv small{margin-top:0}
.recent .rn{font:11px var(--mono);color:var(--muted);white-space:nowrap}

/* ---------- compare ---------- */
.work-title{display:flex;align-items:center;gap:11px;min-width:0;letter-spacing:0}
.work-title-mark{display:grid;place-items:center;width:36px;height:36px;flex:none;border:1px solid var(--red-line);border-radius:8px;background:var(--red-soft);color:var(--red);font-size:19px}
.cmp-page{padding-block:34px 64px}
.cmp-head,.cmp-results-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cmp-head{margin-bottom:22px}
.cmp-head h1{font-size:29px;font-weight:600;line-height:1.3}
.cmp-filters{display:grid;padding:0 18px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.cmp-filter{display:grid;grid-template-columns:8rem minmax(0,1fr);align-items:center;gap:8px 14px;padding:12px 0}
.cmp-filter+.cmp-filter{border-top:1px solid var(--hair)}
.cmp-filter h2{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.cmp-filter h2 .ico{font-size:15px;color:var(--muted)}
.cmp-filter .pill{gap:6px;font-weight:500}
.cmp-filter .pill[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft);box-shadow:inset 0 0 0 1px var(--red-line)}
.cmp-filter .pill .dot{width:6px;height:6px}
.cmp-actions{display:flex;align-items:center;gap:6px}
.cmp-actions .btn{gap:6px;border-radius:6px;background:var(--paper)}
.cmp-actions .ghost{background:transparent}
.cmp-actions .ico{font-size:14px}
#cShare{min-width:104px}
.cmp-actions button:disabled{opacity:.5;cursor:default}
.cmp-note{margin:12px 0 16px;color:var(--muted);font-size:12px;line-height:1.6}
.cmp-results-head{margin-block:22px 10px}
.cmp-results-head h2{font-size:17px;font-weight:600}
.cmp-switch{display:inline-flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;font-weight:500}
.cmp-switch:disabled{color:var(--muted);cursor:default}
.cmp-switch-track{position:relative;width:30px;height:17px;flex:none;border-radius:10px;background:var(--faint)}
.cmp-switch-track::after{content:"";position:absolute;top:3px;left:3px;width:11px;height:11px;border-radius:50%;background:var(--paper);transition:transform .2s ease}
.cmp-switch[aria-checked="true"] .cmp-switch-track{background:var(--t0)}
.cmp-switch[aria-checked="true"] .cmp-switch-track::after{transform:translateX(13px)}
.cmp-switch:disabled .cmp-switch-track{opacity:.55}
.cmptbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.cmp-table{width:100%;border-collapse:separate;border-spacing:0;text-align:left}
.cmp-table :is(th,td){padding:11px 16px;vertical-align:middle}
.cmp-table :is(th,td)+td,.cmp-table thead th+th{border-left:1px solid var(--hair)}
.cmp-table tbody :is(th,td){border-top:1px solid var(--hair)}
.cmp-table th{font-size:13px;font-weight:600}
.cmp-table thead th{background:var(--wash)}
.cmp-table th:first-child{position:sticky;left:0;z-index:1;min-width:120px;max-width:168px;overflow-wrap:anywhere}
.cmp-table tbody th{background:var(--paper)}
.cmp-table tbody tr:hover :is(th,td){background:var(--wash)}
.cmp-table :is(th,td):not(:first-child){min-width:138px}
.cmp-table th a{display:inline-flex;gap:7px;align-items:center}
.cmp-table th a:hover{color:var(--red)}
.cmp-table .direction{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:2px;border-radius:4px;background:var(--wash);color:var(--muted);font-size:11px}
.cmp-table .pv{font:600 15px var(--mono);white-space:nowrap}
.cmp-table .pn,.cmp-table .nod{font:11px/1.5 var(--mono);color:var(--muted)}
.cmp-table .pn{margin-top:4px}
.cmp-table .pn span{display:inline-block;white-space:nowrap}
.cmp-table .low .pv{color:var(--muted)}
.cmp-table .cmp-bar{display:block;height:6px;margin-bottom:7px;overflow:hidden;border-radius:3px;background:var(--hair)}
.cmp-table .cmp-bar i{display:block;height:100%;width:var(--bar);border-radius:inherit;background:var(--t3);transition:width .25s ease,background-color .25s ease}
.cmp-table .low .cmp-bar i{background:var(--none)}
.cmp-table .cmp-improved :is(.pv,.pn){color:var(--t0)}
.cmp-table .cmp-improved .cmp-bar i{background:var(--t0)}
.cmp-table [data-before] .pv{min-width:10ch}
@media(prefers-reduced-motion:reduce){.cmp-switch-track::after,.cmp-table .cmp-bar i{transition:none}}
.cmp-empty{padding:18px 0;color:var(--muted);font-size:13px}
@media(max-width:600px){
  .work-title-mark{width:32px;height:32px;font-size:17px}
  .cmp-page{padding-top:24px}
  .cmp-head h1{font-size:24px}
  .cmp-filters{padding-inline:11px}
  .cmp-filter{grid-template-columns:minmax(0,1fr)}
  .cmp-table :is(th,td){padding:10px}
  .cmp-table th:first-child{min-width:94px;max-width:114px}
  .cmp-table :is(th,td):not(:first-child){min-width:108px}
}

/* ---------- platform page (AccelMark chip detail) ---------- */
.p-hero{text-align:center;padding:56px 0 10px}
.p-hero .eyebrow{justify-content:center;color:var(--muted)}
.p-hero h1{font-size:clamp(36px,5vw,64px);font-weight:500;letter-spacing:-.055em;line-height:1.05;margin-top:12px}
.p-hero .facts{font-size:15px;color:var(--muted);margin-top:12px}
.p-hero .cta{justify-content:center}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:8px;padding:16px 17px;text-align:left;transition:border-color .15s,transform .15s}
button.pcard:hover{border-color:var(--ink);transform:translateY(-1px)}
.pcard.empty{opacity:.5;background:transparent;border-style:dashed}
.pcard .ph{display:flex;align-items:center;gap:9px}
.pcard .ph b{font-size:14px;font-weight:500;flex:1;min-width:0}
.pcard .pv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pcard .pv strong{font:500 26px var(--mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pcard .pv small{font:10.5px var(--mono);color:var(--faint)}
.pcard .pm{font:11px/1.6 var(--mono);color:var(--muted)}
.pcard .hint{margin-top:auto;padding-top:9px;border-top:1px dashed var(--line);font:10.5px var(--mono);color:var(--faint);display:flex;justify-content:space-between}
.pcard .hint span{color:var(--red)}

<script>
"use strict";
function start(DATA) {
/* ======================================================================
   core — data preparation, helpers, router, drawer, tooltip, outline
   ====================================================================== */
const S = DATA.summary, ROWS = DATA.rows;
const REPAIRS = (DATA.repairs && DATA.repairs.repairs) || [];
const LIBGROUPS = (DATA.repairs && DATA.repairs.library_groups) || [];

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const byId = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtInt = n => Number(n).toLocaleString("en-US");
const SUPS = { "-": "⁻", "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹" };
const sup = n => String(n).split("").map(c => SUPS[c] || c).join("");
function fmtNum(v) {
  if (v == null || Number.isNaN(v)) return "—";
  if (v === 0) return "0";
  const a = Math.abs(v);
  if (Number.isInteger(v) && a < 1e7) return fmtInt(v);
  if (a >= 1e4 || a < 1e-4) return v.toExponential(2);
  if (a >= 100) return v.toFixed(1);
  if (a >= 1) return v.toFixed(3);
  return v.toPrecision(3);
}
function fmtFactor(f) {
  if (!isFinite(f) || f <= 0) return "—";
  if (f < 1000) return `${f < 10 ? f.toFixed(2) : f.toFixed(1)}×`;
  const e = Math.floor(Math.log10(f));
  return `${(f / 10 ** e).toFixed(1)}×10${sup(e)}`;
}
const pct = r => r == null ? "—" : `${Math.round(r * 100)}%`;
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const plural = (n, w) => `${fmtInt(n)} ${w}`;
const hashStr = t => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return Math.abs(h); };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

let LANG = (() => { try { const q = new URLSearchParams(location.search).get("lang") || localStorage.getItem("nb-lang"); return q === "en" ? "en" : "zh"; } catch (e) { return "zh"; } })();
const tx = (zh, en) => LANG === "en" ? en : zh;

const TASK = { sft: "SFT", inference: tx("推理", "Inference"), rl: "RL" };
const STATUS = { completed: tx("完整", "Complete"), partial: "partial" };
const PLAT_EN = { "Ascend 910C": "Ascend 910C", "Ascend NPU": "Ascend NPU" };
const SUBJ_EN = { "词表分布": "Logit distribution", "张量/激活": "Tensors & activations", "梯度": "Gradients", "参数/优化器更新": "Optimizer updates",
  "目标分数": "Objective scores", "Checkpoint 往返": "Checkpoint round-trip", "重复性": "Repeatability", "观测开销": "Observer overhead",
  "缓存对照": "Cache contrast", "耗时与开销": "Latency & cost", "综合记录": "General", "未分类": "Unclassified", "其它": "Other" };
const AXIS_EN = { "跨平台": "Cross-platform", "原生 ↔ 独立参考": "Native ↔ Reference", "跨执行模式": "Execution mode", "跨精度": "Precision", "Skills 开关": "Skills toggle", "未分类": "Unclassified" };
const MCOL_META = {
  max_abs: ["最大绝对误差", "Max abs error"], rmse: ["RMSE", "RMSE"], l2: ["L2 误差", "L2 error"],
  cosine: ["余弦相似度", "Cosine similarity"], nll_abs: ["NLL 绝对差", "NLL abs diff"],
  logprob_mae: ["logprob MAE", "logprob MAE"], top1: ["Top-1 一致率", "Top-1 agreement"],
};
const platDisp = p => LANG === "en" ? (PLAT_EN[p] || p) : p;
const subjDisp = s => LANG === "en" ? (SUBJ_EN[s] || s) : s;

/* ---------- outline (right-edge reading outline) ---------- */
let OL_SECS = [], OL_LINKS = [], OL_JUMP = null;
function setupOutline(view) {
  const ol = byId("outline");
  const secs = $$("[data-ol]", view);
  OL_SECS = secs.length >= 3 ? secs : [];
  OL_JUMP = null;
  document.body.classList.toggle("has-ol", OL_SECS.length > 0);
  ol.innerHTML = OL_SECS.length ? `<p>${tx("本页", "ON THIS PAGE")}</p><ol>${OL_SECS.map((s, i) => `<li><a href="#"><span aria-hidden="true">${esc(s.dataset.olNumber ?? String(i + 1).padStart(2, "0"))}</span>${esc(s.dataset.ol)}</a></li>`).join("")}</ol>` : "";
  OL_LINKS = $$("a", ol);
  OL_LINKS.forEach((a, i) => a.onclick = e => {
    e.preventDefault();
    OL_SECS[i].scrollIntoView({ behavior: "instant", block: "start" });
    OL_JUMP = { index: i, top: scrollY };
    syncOutline();
  });
}
/* The outline appears once the opening is behind the reader, so it never sits
   on top of the hero; sections after the opening keep a gutter for it. */
function syncOutline() {
  const ol = byId("outline");
  const tops = OL_SECS.map(s => s.getBoundingClientRect().top);
  const edge = innerHeight * 0.55;
  const visible = scrollY > 8 && tops.length > 1 && tops[1] < edge;
  ol.classList.toggle("on", visible);
  if (!visible) return;
  let active = tops.reduce((last, top, i) => top < edge ? i : last, 0);
  if (OL_JUMP?.top !== scrollY) OL_JUMP = null;
  if (OL_JUMP) active = OL_JUMP.index;
  else if (scrollY + innerHeight >= document.documentElement.scrollHeight - 2) active = tops.length - 1;
  OL_LINKS.forEach((a, i) => i === active ? a.setAttribute("aria-current", "location") : a.removeAttribute("aria-current"));
}
addEventListener("scroll", syncOutline, { passive: true });
addEventListener("resize", syncOutline, { passive: true });

/* ---------- reveal ---------- */
const revealIO = "IntersectionObserver" in window ? new IntersectionObserver(ents => {
  for (const en of ents) if (en.isIntersecting) { en.target.classList.add("in"); revealIO.unobserve(en.target); }
}, { rootMargin: "0px 0px -8% 0px" }) : null;
function observeReveal(view) {
  $$("[data-reveal]:not(.in)", view).forEach(el => revealIO ? revealIO.observe(el) : el.classList.add("in"));
}

  },

  stacks(ink, red) {
    return `<rect x="6" y="8" width="9" height="8" rx="1.2" fill="${ink}"/><rect x="6" y="19" width="9" height="8" rx="1.2" fill="${ink}"/><rect x="6" y="30" width="9" height="8" rx="1.2" fill="${ink}"/>

/* ---------- glossary ---------- */
const GLOSS_BI = {
  pair: [["成对比较", "将同一输入与模型权重送入两条执行路径，逐元素对齐输出所得的对照记录。"], ["Pairwise comparison", "Element-wise diff of two execution paths given identical inputs and weights."]],
  head: [["主读数", "每条记录用于展示与排序的首选指标：最大绝对误差 → 余弦相似度 → NLL 绝对差 → logprob MAE → RMSE → L2 → Top-1 一致率。"], ["Headline metric", "Primary scalar per record: Max abs error → Cosine → NLL abs diff → logprob MAE → RMSE → L2 → Top-1."]],
  dev: [["偏离", "输出偏离完全一致的幅度。误差类取绝对值，余弦与 Top-1 取 1 − 值，共用对数刻度。"], ["Deviation", "Distance from exact agreement: |v| for error metrics and 1 − v for cosine / Top-1 on a shared log axis."]],
  tier: [["一致性分级", "依据最大绝对误差或余弦相似度划分为五档：位级一致、≤1e-6、≤1e-3、≤1、>1。"], ["Agreement tier", "Five bands from Max abs error or Cosine: Bitwise exact, ≤1e-6, ≤1e-3, ≤1, and >1."]],
  bit: [["位级一致", "最大绝对误差精确为 0，或余弦相似度精确为 1。"], ["Bitwise exact", "Max abs error = 0 or Cosine similarity = 1."]],
  ungraded: [["未分级", "仅采集 NLL、logprob 等标量指标，未采集最大绝对误差或余弦相似度的记录。"], ["Ungraded", "Records with NLL or logprob metrics only, without Max abs error or Cosine."]],
  partial: [["partial", "实际采集或对齐的张量、步数少于预定数量。"], ["partial", "Fewer tensors or steps were captured or aligned than planned."]],
  cov: [["覆盖", "实际对齐元素数占预定总数的比例。"], ["Coverage", "Observed elements divided by expected elements."]],
  kind: [["比较类型", "按双端关系分为四类：NPU ↔ GPU、对 CPU 参考、同平台内、其它。"], ["Comparison type", "NPU ↔ GPU, vs. CPU Reference, Same-platform, or Other."]],
  group: [["分组", "按评测场景组织的专题视图，组内按覆盖最广的单一指标排序。"], ["Scenario group", "Curated view ranked by the most frequent metric in that scenario."]],
  worst: [["最差情况", "该平台在当前对象下全部成对记录中的最大偏离读数。"], ["Worst case", "Largest deviation observed across all paired records involving this platform."]],
  median: [["中位偏离", "该平台在当前对象下全部读数的偏离中位数。"], ["Median drift", "Median deviation across all readings for this platform and target."]],
  lown: [["样本少", "记录不足 3 条，不参与最小偏离判定。"], ["Small sample", "Fewer than 3 records; excluded from lowest-drift highlight."]],
  zero: [["精确归零", "补丁复验后误差精确降至 0。"], ["Exact zero", "Residual error reduced to exact 0 after patch verification."]],
  machine: [["降到机器精度", "修复后残差 ≤1e-5，收敛至浮点舍入噪声范围。"], ["Machine precision", "Post-fix residual ≤1e-5, within floating-point rounding noise."]],
  partfix: [["部分收敛", "误差显著下降但仍高于 1e-5，尚存其余分叉源。"], ["Partial convergence", "Error reduced substantially but remains >1e-5 due to other low-precision paths."]],
  qual: [["仅定性", "以校验项通过与否记录复验结论，无前后连续标量。"], ["Qualitative", "Verified via pass/fail assertions without continuous before/after scalars."]],
  factor: [["改善倍数", "修复前偏离 ÷ 修复后偏离；修复后为 0 时记为 → 0。"], ["Improvement factor", "Pre-fix drift ÷ post-fix drift; shown as → 0 when exact zero is reached."]],

const glossOf = k => (GLOSS_BI[k] || [[k, ""], [k, ""]])[LANG === "en" ? 1 : 0];

function foldList(items, what, limit = 200) {

}

const FACETBY = () => Object.fromEntries(FACETS.map(f => [f.key, f]));
function reportBase() { let rows = LS.col ? COLBY[LS.col].rows : ROWS; if (LS.ev) rows = rows.filter(r => r.eval_id === LS.ev); return rows; }
const selPass = (r, keys) => { const FB = FACETBY(); return keys.every(k => !LS.f[k].size || facetPass(r, FB[k])); };

REPAIRS.forEach(rp => {

const issuesFor = (name, ver) => REPAIRS.filter(rp => !rp.followup && rp.alib === name && rp.aver != null && rp.aver.toLowerCase() === String(ver).toLowerCase());
const otherIssues = (name, ver) => REPAIRS.filter(rp => !rp.followup && rp.alib === name && !(rp.aver != null && rp.aver.toLowerCase() === String(ver).toLowerCase()));

const RUNTIME = ["PyTorch", "torch_npu", "CUDA runtime", "CUDA nvcc", "CANN", "Driver", "Python"];
const sideOn = (r, p) => (r.sides || []).find(s => s.platform === p);
const envOf = side => {
  const seen = new Map();
  for (const l of (side?.libraries || []).map(parseLib)) if (l.name && !seen.has(l.name)) seen.set(l.name, l);
  return [...seen.values()];
};
const libRank = (name, fws) => fws.includes(name) ? 0 : RUNTIME.includes(name) ? 1 : 2;
const flatSettings = side => { const m = {}; (side?.settings || []).forEach(g => g.fields.forEach(([k, v]) => { m[k] = String(v); })); return m; };
const NOISE = /revision|baseline|sha|hash|seed|path|commit|时间|time|device_name|runtime_device|instance_visible|calls|captures|measured|tested|tokens|count|load|label|entry|entries|入口|source|id$|标识|版本|conclusion|结论|steps|before|after|model/i;
const KNOB = /dtype|precision|精度|attention|attn|determin|tf32|hf32|matmul|cudnn|benchmark|use_cache|cache|parallel|world_size|拓扑|execution|mode|模式|optimizer|fused|fusion|kernel|cube_math|jit|归一化|compile|bf16|fp16|hooks|skills|partition|chunk|分块/i;

function knobDiffs(rows, plat) {
  const K = new Map();
  for (const r of rows) {
    const [a, b] = r.sides || [];
    if (!a || !b || a.platform !== plat || b.platform !== plat) continue;
    const A = flatSettings(a), B = flatSettings(b);
    for (const k of Object.keys(A)) {
      if (B[k] === undefined || A[k] === B[k] || NOISE.test(k) || A[k].length > 60 || B[k].length > 60) continue;
      if (!K.has(k)) K.set(k, { k, pairs: new Set(), max: null, n: 0, rows: [] });
      const e = K.get(k); e.pairs.add(`${A[k]} ↔ ${B[k]}`); e.n++; e.rows.push(r.id);
      if (r.dev != null) e.max = e.max == null ? r.dev : Math.max(e.max, r.dev);
    }
  }
  return [...K.values()].sort((x, y) => (y.max ?? -1) - (x.max ?? -1) || y.n - x.n);
}

function recipeFor(rows, plat, fw) {
  const groups = new Map();
  for (const r of rows) {
    if (fw && !r.stack.includes(fw)) continue;
    const s = sideOn(r, plat); if (!s) continue;
    const env = envOf(s); if (!env.length) continue;
    const key = env.map(l => `${l.name} ${l.ver}`).sort().join(" | ");
    if (!groups.has(key)) groups.set(key, { key, env, side: [], rows: [] });
    const g = groups.get(key); g.rows.push(r); g.side.push(s);
  }
  const fws = fw ? [fw] : [...new Set(rows.flatMap(r => r.stack))];
  const list = [...groups.values()].map(g => {
    g.worst = g.rows.reduce((m, r) => (r.tier != null && r.tier > m ? r.tier : m), -1);
    g.t4 = g.rows.filter(r => r.tier === 4).length;
    g.open = g.env.flatMap(l => issuesFor(l.name, l.ver)).filter(rp => rp.status !== "validated");
    g.fixed = g.env.flatMap(l => issuesFor(l.name, l.ver)).filter(rp => rp.status === "validated");
    g.env.sort((a, b) => libRank(a.name, fws) - libRank(b.name, fws) || a.name.localeCompare(b.name));
    const S = g.side.map(flatSettings);
    g.settings = Object.keys(S[0] || {}).filter(k => KNOB.test(k) && !NOISE.test(k) && S[0][k].length <= 48 && S.every(x => x[k] === S[0][k])).slice(0, 12).map(k => [k, S[0][k]]);
    return g;
  });
  list.sort((a, b) => (a.open.length > 0) - (b.open.length > 0) || (a.t4 > 0) - (b.t4 > 0) || b.rows.length - a.rows.length || a.worst - b.worst);
  return list;
}

function selOptions(k, idx) {
  const FB = FACETBY(), prior = SELK.slice(0, idx);
  const pool = reportBase().filter(r => selPass(r, prior));
  const counts = new Map();
  for (const r of pool) { const v = FB[k].get(r); for (const x of (Array.isArray(v) ? v : [v])) counts.set(x, (counts.get(x) || 0) + 1); }
  let vals = [...counts.keys()];
  if (k === "task") vals = ["inference", "sft", "rl"].filter(v => counts.has(v));
  else if (k === "plat") vals.sort((a, b) => ({ acc: 0, gpu: 1, cpu: 2 }[famOf(a)] - { acc: 0, gpu: 1, cpu: 2 }[famOf(b)]) || counts.get(b) - counts.get(a));
  else if (k === "model") vals.sort((a, b) => (a === FIXTURE) - (b === FIXTURE) || counts.get(b) - counts.get(a));
  else vals.sort((a, b) => counts.get(b) - counts.get(a));
  return { vals, counts, total: pool.length };
}

function quickPicks() {
  const m = new Map();
  for (const r of ROWS) for (const p of r.uplats) { if (famOf(p) === "cpu") continue; for (const f of r.stack) { const k = `${r.task}|${p}|${f}`; m.set(k, (m.get(k) || 0) + 1); } }

}

function renderReport() {
  const box = byId("lRep"), rows = selRows(), task = selVal("task"), plat = selVal("plat"), fw = selVal("fw"), model = selVal("model");

      <div class="pills" style="justify-content:center;margin-top:14px">${quickPicks().map(([k, n]) => { const [t, p, f] = k.split("|");
        return `<button class="pill" type="button" data-qp="${esc(k)}">${pdot(p)}${taskPill(t)} · ${esc(platDisp(p))} · ${esc(f)}<span class="n">${n}</span></button>`; }).join("")}</div></div>`;

/* ======================================================================
   how — the principle page, animated the inference-rsi way. Every scene
   is a pure function of time t; a rAF clock advances t only while the
   scene is on screen and the tab is visible; reduced motion parks it on
   its most telling frame. Illustrations are labelled as such; the boxes
   marked 实测 under each scene carry real records.
   ====================================================================== */
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const ease = x => x < .5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2;
const lerp = (a, b, p) => a + (b - a) * p;
const SCENES = {};
const prand = i => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
window.NF_SCENES = SCENES;

// Overlay alternate text so the longest variant reserves space without being shown.
const slotHtml = variants => variants.map((html, i) => `<span aria-hidden="${i !== 0}">${html}</span>`).join("");
function showSlot(slot, index) {
  if (slot.dataset.index === String(index)) return;
  slot.dataset.index = index;
  Array.from(slot.children).forEach((child, i) => child.setAttribute("aria-hidden", String(i !== index)));
}

function makeScene(root, cfg) {
  const steps = cfg.steps;
  const playBtn = $(".dm-play", root), replayBtn = $(".dm-replay", root), cap = $(".dm-cap", root), chips = $(".dm-steps", root), stage = $(".dm-stage", root);
  if (cfg.stableCaption) {
    cap.classList.add("fw-slot");
    cap.innerHTML = slotHtml(steps.map(s => s.cap));
  }
  chips.style.setProperty("--n", steps.length);
  chips.innerHTML = steps.map((s, i) => `<button type="button" data-i="${i}"><span>${String(i + 1).padStart(2, "0")}</span>${esc(s.label)}</button>`).join("");
  const chipEls = [...chips.children];
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  let time = 0, playing = false, visible = false, last = null, auto = !reduced(), cur = -1;
  const stepAt = t => steps.reduce((k, s, i) => (t >= s.at ? i : k), 0);
  function paint(t) {
    cfg.render(t);
    const k = stepAt(t), end = k + 1 < steps.length ? steps[k + 1].at : cfg.loop;
    if (k !== cur) {
      cur = k;
      chipEls.forEach((b, i) => { if (i === k) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); b.style.setProperty("--p", 0); });
      if (cfg.stableCaption) showSlot(cap, k);
      else cap.innerHTML = steps[k].cap;
    }
    chipEls[k].style.setProperty("--p", seg(t, steps[k].at, end).toFixed(3));
  }
  /* jumps (loop, replay, step click) land without transitions so nothing
     visibly rewinds */
  function snapTo(t) {
    root.classList.add("snap"); time = t; cur = -1; paint(t);
    void root.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove("snap")));
  }
  function setPlaying(v) {
    playing = v; last = null; root.dataset.playing = String(v);
    playBtn.textContent = v ? tx("暂停", "Pause") : tx("播放", "Play"); playBtn.setAttribute("aria-pressed", String(v));
  }
  function tick(now) {
    if (playing && visible && !document.hidden) {
      if (last !== null) {
        time += Math.min(0.1, (now - last) / 1000);
        if (time >= cfg.loop) { snapTo(0); last = now; requestAnimationFrame(tick); return; }
      }
      last = now; paint(time);
    } else last = null;
    requestAnimationFrame(tick);
  }
  playBtn.onclick = () => { auto = false; setPlaying(!playing); };
  replayBtn.onclick = () => { auto = false; snapTo(0); setPlaying(true); };
  chipEls.forEach((b, i) => { b.onclick = () => { auto = false; snapTo(steps[i].at + 0.001); }; });
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(es => {
      const e = es[es.length - 1];
      visible = e.isIntersecting; last = null;
      if (auto && e.intersectionRatio >= 0.35) { auto = false; setPlaying(true); }
    }, { threshold: [0, 0.35] }).observe(stage);
  } else visible = true;
  if (reduced()) time = cfg.still;
  setPlaying(false); snapTo(time);
  requestAnimationFrame(tick);
  SCENES[cfg.name] = {
    seek(t) { auto = false; setPlaying(false); snapTo(Math.max(0, Math.min(cfg.loop - 0.01, t))); return time; },
    play() { auto = false; setPlaying(true); }, pause() { auto = false; setPlaying(false); },
    state: () => ({ time, playing, visible, step: stepAt(time) }),
  };
}

function whitenCase() {

  const mean = R.reduce((a, x, i) => a + x * M[i], 0) / n;
  const varU = R.reduce((a, x, i) => a + M[i] * (x - mean) ** 2, 0) / n * n / (n - 1);
  const W = R.map(x => (x - mean) / Math.sqrt(varU + 1e-8) + mean);   // masked_whiten(shift_mean=False)
  const Wfix = W.map((x, i) => x * M[i]);                               // the one-line fix: re-mask

      const gateIndex = t >= 10.9 && t < 12.4 ? 1 : t >= 16.8 ? 2 : 0;

const CMP_PLATFORMS = [...new Set([...PLATS.map(p => p.name), ...Object.values(CMP_REPAIRS).flatMap(Object.keys)])];
let cmpBuilt = false;
function cmpDefault(picks, subject) {
  const counts = new Map();
  for (const r of ROWS) {
    if (r.uplats.length !== 2 || !CMP_SUBJECTS.includes(r.subject) || !Object.keys(r.metrics).length ||
        (subject && r.subject !== subject) || !picks.every(p => r.uplats.includes(p))) continue;
    const key = JSON.stringify([r.subject, [...r.uplats].sort()]);
    if (!counts.has(key)) counts.set(key, {
      subject: r.subject, platforms: [...r.uplats].sort(), n: 0,
      paired: r.uplats.filter(p => CMP_REPAIRS[r.subject]?.[p]).length,
    });
    counts.get(key).n++;
  }
  const best = [...counts.values()].sort((a, b) => b.paired - a.paired || b.n - a.n)[0];
  return best ? [best.subject, best.platforms] : [subject || CMP_SUBJECTS[0] || null, []];
}

function paintFingerprint(p, fam) {
  const W = 640, L = 150, R = 20, T = 26, rowH = 44;
  const lo = -16, hi = 1, zeroX = L + 8, x0 = L + 34;
  const xOf = d => d <= 0 ? zeroX : x0 + (Math.min(hi, Math.max(lo, Math.log10(d))) - lo) / (hi - lo) * (W - R - x0);
  let g = "";
  for (const t of [-12, -8, -4, 0]) { const x = xOf(10 ** t); g += `<line class="gridl" x1="${x}" x2="${x}" y1="${T - 6}" y2="${T + SUBJ.length * rowH - 10}"/><text class="ax" x="${x}" y="${T - 12}" text-anchor="middle">10${sup(t)}</text>`; }
  g += `<text class="ax" x="${zeroX}" y="${T - 12}" text-anchor="middle">0</text>`;
  const leg = [], facts = [];
  SUBJ.forEach((s, i) => {
    const lead = subjMetric(s, p) || SUBJ_LEAD[s], y = T + i * rowH + rowH / 2 - 6;
    g += `<text class="ax-col" x="${L - 12}" y="${y}" text-anchor="end" dominant-baseline="middle">${esc(s)}</text><line class="gridl" x1="${zeroX}" x2="${W - R}" y1="${y}" y2="${y}"/>`;
    let mine = null; const others = [];
    for (const [q, st] of Object.entries(CMP[s] || {})) {
      const m = st[lead]; if (!m) continue;
      const d = devOf(lead, m.median);
      if (q === p) { mine = { d, m }; continue; }
      others.push(d);
      g += `<circle cx="${xOf(d).toFixed(1)}" cy="${y}" r="5" fill="var(--none)" stroke="var(--paper)" stroke-width="2"><title>${esc(q)} · 中位偏离 ${fmtNum(d)} · n=${m.n}</title></circle>`;
    }
    if (mine) g += `<circle cx="${xOf(mine.d).toFixed(1)}" cy="${y}" r="7" fill="${famColor(fam)}" stroke="var(--paper)" stroke-width="2"><title>${esc(p)} · 中位偏离 ${fmtNum(mine.d)} · n=${mine.m.n}</title></circle>`;
    facts.push({ s, lead, mine, others });
    leg.push(`<li><span class="letter" style="border-radius:4px">${i + 1}</span><span>${esc(s)}<small class="note" style="display:block;line-height:1.3">${esc(MCOL[lead]?.label || lead)}</small></span><span class="v">${mine ? fmtNum(mine.m.median) : "—"}<small>${mine ? "n=" + mine.m.n : "未参与"}</small></span></li>`);
  });
  byId("pFp").innerHTML = g;
  byId("pFpLeg").innerHTML = leg.join("");
  const have = facts.filter(f => f.mine), take = byId("pFpTake");
  if (!have.length) { byId("pFpA").textContent = "该平台暂无可统计的分类比较记录。"; take.hidden = true; return; }
  const w = have.reduce((a, b) => b.mine.d > a.mine.d ? b : a);
  byId("pFpA").innerHTML = w.mine.d === 0 ? `参测的 ${have.length} 类对象中位偏离均为 0。`
    : `${esc(w.s)}：中位偏离 ${fmtNum(w.mine.d)}（${esc(MCOL[w.lead]?.label || w.lead)}）${w.others.length && w.mine.d > Math.max(...w.others) ? "，处于参测平台最右端" : ""}。`;
  const cmpd = have.filter(f => f.others.length);
  const lower = cmpd.filter(f => f.mine.d < median(f.others)).length, zeros = have.filter(f => f.mine.d === 0).length;
  let t = "";
  if (cmpd.length === 1) { const f1 = cmpd[0], om = median(f1.others); t = `仅在「${esc(f1.s)}」下有横向对照：中位偏离 ${fmtNum(f1.mine.d)}，${f1.mine.d < om ? "低于" : f1.mine.d > om ? "高于" : "等于"}其余平台中位数 ${fmtNum(om)}。`; }
  else if (cmpd.length) t = `具备横向对照的 ${cmpd.length} 类对象中，${lower ? `${lower} 类中位偏离低于其余平台中位数` : "各类的中位偏离均不低于其余平台中位数"}${zeros ? `；${zeros} 类中位偏离为 0` : ""}${have.length > cmpd.length ? `。另有 ${have.length - cmpd.length} 类仅含该平台自身记录` : ""}。`;
  take.innerHTML = t; take.hidden = !t;
}

addEventListener("keydown", e => {
  const typing = /input|textarea|select/i.test(e.target.tagName);
  if (e.key === "Escape") { if (isOpen()) { closeDrawer(); e.preventDefault(); } else if (typing) e.target.blur(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const name = parseHash().name;
  if (e.key === "/") { const q = name === "cases" ? $(".lc-option-dialog[open] input", byId("v-cases")) : name === "repairs" ? byId("rQ") : name === "list" ? byId("lQ") : null; if (q && !byId(VIEWS[name]).hidden) { e.preventDefault(); q.focus(); q.select(); } return; }
  if (isOpen()) {
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveDrawer(1); }
    if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveDrawer(-1); }
    return;
  }
  if (name === "list" && (e.key === "j" || e.key === "k" || e.key === "Enter")) {
    const rows = $$("#lTbl .trow[data-id]");
    if (!rows.length) return;
    if (e.key === "Enter") { if (LS.cursor >= 0) openFromList(rows[LS.cursor].dataset.id); return; }
    e.preventDefault();
    LS.cursor = Math.max(0, Math.min(rows.length - 1, LS.cursor + (e.key === "j" ? 1 : -1)));
    rows.forEach((r, i) => r.classList.toggle("cur", i === LS.cursor));
    rows[LS.cursor].scrollIntoView({ block: "nearest" }); rows[LS.cursor].focus({ preventScroll: true });
  }
});
