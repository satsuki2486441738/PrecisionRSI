<style>
/* NumericBridge v2 — AccelMark's information architecture (results / compare /
   platform / suites) dressed in inference-rsi's reading view: warm paper, one
   red, Space Grotesk display, IBM Plex Mono for every label and number. */
:root{
  --bg:#f7f5f2; --paper:#fff; --ink:#232328; --muted:#56545d; --faint:#8b8890;
  --line:#d9d5cf; --hair:#ebe7e1; --wash:#f1eee9;
  --red:#c92336; --red-soft:#c923360d; --red-line:#c9233640;
  --bar-bg:rgba(247,245,242,.88);
  /* agreement ramp: unremarkable while it agrees, the brand red when it does not */
  --t0:#3f7a6c; --t1:#6a7d73; --t2:#9a7520; --t3:#bb5324; --t4:#c92336; --none:#c9c5be;
  /* comparison kind — validated all-pairs (dataviz slots 2/1/3) */
  --k-cross:#eb6834; --k-cpu:#2a78d6; --k-same:#1baf7a; --k-other:#9a979e;
  /* platform family */
  --p-acc:#6250d6; --p-gpu:#008300; --p-cpu:#9a979e;
  --display:'Space Grotesk',"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hdr:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0c0e; --paper:#131417; --ink:#f1efed; --muted:#a3a4ab; --faint:#74767e;
    --line:#2c2d33; --hair:#1d1e22; --wash:#17181b;
    --red:#f33143; --red-soft:#f3314314; --red-line:#f3314350;
    --bar-bg:rgba(11,12,14,.86);
    --t0:#5f9488; --t1:#7d8f86; --t2:#b08a3c; --t3:#d1673a; --t4:#f33143; --none:#3a3c42;
    --k-cross:#d95926; --k-cpu:#3987e5; --k-same:#199e70; --k-other:#6c6e76;
    --p-acc:#9085e9; --p-gpu:#0ca30c; --p-cpu:#6c6e76;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0c0e; --paper:#131417; --ink:#f1efed; --muted:#a3a4ab; --faint:#74767e;
  --line:#2c2d33; --hair:#1d1e22; --wash:#17181b;
  --red:#f33143; --red-soft:#f3314314; --red-line:#f3314350;
  --bar-bg:rgba(11,12,14,.86);
  --t0:#5f9488; --t1:#7d8f86; --t2:#b08a3c; --t3:#d1673a; --t4:#f33143; --none:#3a3c42;
  --k-cross:#d95926; --k-cpu:#3987e5; --k-same:#199e70; --k-other:#6c6e76;
  --p-acc:#9085e9; --p-gpu:#0ca30c; --p-cpu:#6c6e76;
  color-scheme:dark;
}

/* ---------- reset ---------- */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 18px);-webkit-text-size-adjust:100%;scrollbar-gutter:stable;overflow-y:scroll}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
h1,h2,h3,h4,p,figure,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
/* Buttons carry no UA chrome anywhere: v1 left the default 2px outset border on
   every row and "view all" button, which drew grey bars down card edges. */
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:4px}
::selection{background:var(--red);color:#fff}
[hidden]{display:none!important}
.wrap{width:min(1200px,calc(100% - 64px));margin-inline:auto}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;vertical-align:middle}
.dot.sq{border-radius:2px;transform:rotate(45deg) scale(.86)}

/* ---------- type ---------- */
.eyebrow{display:inline-flex;align-items:center;gap:9px;font:500 11px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.eyebrow .live{width:5px;height:5px;background:var(--red);box-shadow:0 0 12px var(--red)}
.mono-note{font:400 10px/1.6 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.topline{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:18px}
.h1{font-weight:500;font-size:clamp(30px,3.3vw,48px);line-height:1.16;letter-spacing:-.04em;max-width:16em;word-break:keep-all;overflow-wrap:anywhere}
.h2{font-weight:500;font-size:clamp(24px,2.5vw,34px);line-height:1.25;letter-spacing:-.035em;word-break:keep-all;overflow-wrap:anywhere}
br.d{display:inline}
@media (max-width:860px){br.d{display:none}}
.h1 em,.h2 em,.h3 em{font-style:normal;color:var(--red)}
.h3{font-weight:500;font-size:20px;line-height:1.3;letter-spacing:-.02em}
.lead{font-size:16px;line-height:1.85;color:var(--muted);max-width:60ch}
.sub{font-size:14px;line-height:1.8;color:var(--muted);max-width:72ch}
.note{font-size:12.5px;line-height:1.8;color:var(--faint)}
.note b,.sub b,.lead b{color:var(--ink);font-weight:500}

/* ---------- header (frosted reading bar) ---------- */
.site{position:sticky;top:0;z-index:50;height:var(--hdr);background:var(--bar-bg);border-bottom:1px solid var(--line);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
.site .wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:28px}
.site .brand{justify-self:start}
.site .acts{justify-self:end}
.brand{display:inline-flex;align-items:center;gap:12px;white-space:nowrap}
.brand-mark{display:block;width:36px;height:36px;flex:none;color:var(--ink);transition:transform .25s}
.brand:hover .brand-mark{transform:translateY(-1px) rotate(-3deg)}
.mascot{display:block;width:84px;height:84px;margin:0 auto 12px;color:var(--ink)}
.mascot .mf{animation:nf-bob 2.4s ease-in-out infinite}
@keyframes nf-bob{50%{transform:translateY(-1.5px)}}
@media (prefers-reduced-motion:reduce){.mascot .mf{animation:none}}
.brand b{display:block;font:600 12px/1.25 var(--display);letter-spacing:.14em;text-transform:uppercase}
.brand small{display:block;font:400 9px/1.4 var(--mono);letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.nav{display:flex;gap:26px;justify-content:center;min-width:0}
.nav a{position:relative;font-size:13px;color:var(--muted);padding:6px 0;white-space:nowrap;transition:color .2s}
.nav a:hover{color:var(--red)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--red)}
.acts{display:flex;align-items:center;gap:10px}
.iconbtn{display:grid;place-content:center;width:36px;height:36px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:15px;transition:border-color .2s,color .2s}
.iconbtn:hover{border-color:var(--ink);color:var(--ink)}
.langbtn{width:auto;min-width:40px;padding:0 9px;font:500 11px/1 var(--mono);letter-spacing:.06em}
.acts .github-link{gap:6px}
.github-link svg{width:16px;height:16px;flex:none;fill:currentColor}
.mockbar{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);font:10px/1.6 var(--mono);letter-spacing:.04em;color:var(--faint)}
.mockbar b{font-weight:500;color:var(--red)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:18px;min-height:42px;padding:10px 18px;border:1px solid var(--line);border-radius:4px;font-size:13px;font-weight:500;line-height:1.3;white-space:nowrap;background:transparent;transition:background .2s,border-color .2s,transform .2s,color .2s}
.btn span{font-size:16px;line-height:1}
.btn:hover{border-color:var(--ink);transform:translateY(-1px)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{min-height:32px;padding:6px 12px;font-size:12px;gap:10px}
.btn.sm span{font-size:13px}
.btn.sm .csv-label{font-size:inherit}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.link{color:var(--red);font-size:13px;display:inline-flex;gap:8px;align-items:center}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- sections ---------- */
.view{padding:0 0 40px}
.sec{padding:72px 0 0}
.sec.first{padding-top:56px}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:20px 56px;align-items:end;margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.sec-head:not(:has(.sub)){grid-template-columns:1fr}
.sec-head .sub{margin:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px}

/* ---------- home hero ---------- */
.hero{padding:58px 0 0}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(330px,.95fr);gap:56px;align-items:center}
.hero .lead{margin-top:24px}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:30px}
.proof{padding:22px 24px 20px}
.proof-top{display:flex;justify-content:space-between;gap:14px;font:10px/1.5 var(--mono);letter-spacing:.06em;color:var(--faint);text-transform:uppercase;padding-bottom:14px;border-bottom:1px solid var(--hair)}
.pbars{display:grid;gap:15px;margin-top:16px}
.pbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:end}
.pbar .lab{font-size:13px;line-height:1.35}
.pbar .lab small{display:block;font:10.5px var(--mono);color:var(--faint);margin-top:2px}
.pbar .val{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.pbar .trk{grid-column:1/-1;height:8px;background:var(--hair);border-radius:2px;overflow:hidden;margin-top:6px}
.pbar .trk i{display:block;height:100%;border-radius:0 4px 4px 0}
.proof figcaption{margin-top:18px;padding-top:14px;border-top:1px solid var(--hair);font-size:12.5px;line-height:1.75;color:var(--muted)}
.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:64px;padding-top:34px;border-top:1px solid var(--line)}
.result{padding:0 34px 4px;border-left:1px solid var(--line)}
.result:first-child{padding-left:0;border-left:0}
.result-num{display:block;color:var(--red);font-size:clamp(46px,5.2vw,72px);line-height:1.04;letter-spacing:-.06em;font-weight:500;font-variant-numeric:tabular-nums}
.result-num small{font-size:.5em;letter-spacing:-.02em;margin-left:4px}
.result h3{font-size:17px;font-weight:400;letter-spacing:-.01em;margin-top:10px}
.result p{font:11.5px/1.6 var(--mono);color:var(--muted);margin-top:12px}
.result p i{font-style:normal;color:var(--red);padding:0 6px}
:is(#v-overview,#v-cite) .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
#v-overview .sec-head .h2{max-width:none;word-break:normal}
.home-intro{padding:62px 0 42px;text-align:center}
.home-intro .h1{max-width:none;font-size:64px;letter-spacing:0;color:var(--red)}
.home-tagline{max-width:1080px;margin:12px auto 0;font-size:28px;font-weight:500;line-height:1.35;text-wrap:balance}
.home-tagline strong{font-weight:650}
.home-affiliations{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 24px;margin:24px 0 0;padding:0;list-style:none;color:var(--muted);font-size:14px}
.home-workflow{margin:0 auto}
.home-coverage,.home-results{margin-top:48px}
.home-section-title{position:relative;min-width:0;padding-inline-start:14px;color:var(--ink);font-size:32px;font-weight:650;line-height:1.25}
.home-section-title::before{content:"";position:absolute;inset-inline-start:0;top:.19em;width:3px;height:.87em;background:var(--red);border-radius:2px}
.home-results .home-section-title{margin-bottom:18px}
.home-coverage-head,.home-citation{display:flex;align-items:baseline;justify-content:space-between;gap:6px 20px;flex-wrap:wrap}
.home-coverage-head{margin-bottom:18px}
.home-coverage h3{color:var(--muted);font-size:13px;font-weight:550}
.home-platforms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0 18px}
.home-platform{min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:12px}
.home-platform header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.home-platform h4{font-size:14px;font-weight:550}
.home-platform img,.home-platform .ico{display:block;width:24px;height:20px;object-fit:contain}
.home-platform img[src$="ascend.svg"]{width:42px}
.home-platform.soon{border-style:dashed;background:transparent}
.home-platform .soon-label{color:var(--muted);font-size:12px}
.home-stack{display:flex;flex-wrap:wrap;gap:5px}
.home-stack a{display:block;padding:2px 8px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font-size:12px;overflow-wrap:anywhere}
.home-stack a:hover{border-color:var(--red);color:var(--red)}
.home-frameworks{margin-top:6px;border-top:1px solid var(--line)}
.home-frameworks>div{display:grid;grid-template-columns:82px minmax(0,1fr);gap:8px 12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.home-frameworks dt{font-size:13px;font-weight:550}
.home-citation{margin:48px 0 44px;padding-top:20px;border-top:1px solid var(--line)}
.home-citation p,.home-coverage-status{margin-top:4px;color:var(--muted);font-size:13px}
.home-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 24px}
.home-stat{display:flex;flex-direction:column;align-items:flex-start;min-width:0;border-top:1px solid var(--line);padding-top:12px}
.home-stat dt{font-size:14px;font-weight:500;line-height:1.4}
.home-stat dt a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.home-stat dt a:hover{text-decoration-color:currentColor}
.home-stat .home-stat-value{order:-1;margin-bottom:6px;color:var(--red);font-size:38px;line-height:1.12;font-weight:500;font-variant-numeric:tabular-nums}
.home-stat .home-stat-value.pending{display:flex;align-items:center;min-height:42.56px;color:var(--muted);font-size:17px}
.home-stat-note{margin-top:5px;font-size:12px;line-height:1.5;color:var(--muted)}
.home-stat[data-stat="prs"]{position:relative}
.home-stat-trigger{border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.home-stat-trigger:hover{text-decoration-color:currentColor}
.home-stat-trigger::after{content:"";position:absolute;inset:0}
.home-stat-trigger:focus-visible::after{outline:2px solid currentColor;outline-offset:3px}
.home-pr-dialog{box-sizing:border-box;width:min(440px,calc(100% - 32px));max-height:calc(100% - 32px);padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}
.home-pr-dialog::backdrop{background:rgb(0 0 0 / .48)}
.home-pr-dialog h3{margin:0;font-size:20px}
.home-pr-dialog ul{list-style:none;margin:14px 0 0;padding:0}
.home-pr-dialog li{border-top:1px solid var(--line);padding:12px 0}
.home-pr-dialog li div{display:flex;justify-content:space-between;gap:12px}
.home-pr-dialog li a{display:inline-block;margin-top:3px;text-decoration:underline;text-underline-offset:2px}
.home-pr-dialog form{display:flex;justify-content:flex-end;margin-top:10px}
@media(max-width:780px){.home-stats,.home-platforms{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.home-intro .h1{font-size:52px}.home-tagline{font-size:24px}}
@media(max-width:600px){
  .home-intro{padding:36px 0 28px}
  .home-intro .h1{font-size:40px}
  .home-tagline{margin-top:8px;font-size:18px}
  .home-affiliations{margin-top:16px;gap:5px 14px;font-size:13px}
  .home-coverage,.home-results{margin-top:34px}
  .home-section-title{font-size:26px}
  .home-citation{margin:34px 0 34px}
  .home-frameworks>div{grid-template-columns:1fr}
  .home-stats{column-gap:14px}
  .home-stat .home-stat-value{font-size:30px}
  .home-stat .home-stat-value.pending{min-height:33.6px;font-size:14px}
  #v-overview .proof-top{flex-direction:column;gap:4px}
}
@media(max-width:360px){.home-intro .h1{font-size:36px}}

/* ---------- pills / facets (AccelMark) ---------- */
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:30px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:12.5px;color:var(--muted);white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
.pill:hover{border-color:var(--ink);color:var(--ink)}
.pill .n{font:10.5px var(--mono);color:var(--faint)}
.pill[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft);color:var(--ink);font-weight:500}
.pill[aria-pressed="true"] .n{color:var(--red)}
.pill:disabled{opacity:.38;cursor:default;border-color:var(--hair)}
.pill.solid[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pill.solid[aria-pressed="true"] .n{color:var(--paper);opacity:.7}
.letter{display:inline-grid;place-content:center;width:20px;height:20px;border-radius:50%;background:var(--hair);font:600 10px/1 var(--mono);color:var(--muted);flex:none}
.pill[aria-pressed="true"] .letter{background:var(--red);color:#fff}
.pill.solid[aria-pressed="true"] .letter{background:color-mix(in srgb,var(--paper) 22%,transparent);color:var(--paper)}
.sq-letter{display:inline-grid;place-content:center;width:24px;height:24px;border-radius:5px;background:var(--ink);color:var(--paper);font:600 11px/1 var(--mono);flex:none}
.tag{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;font:10.5px/1.5 var(--mono);color:var(--muted);white-space:nowrap}
.tag+.tag::before{content:"·";color:var(--faint);margin:0 5px 0 6px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font:10.5px/1.6 var(--mono);color:var(--muted);white-space:nowrap}
.badge.warn{border-color:color-mix(in srgb,var(--t2) 55%,transparent);color:var(--t2)}
.badge.ok{border-color:color-mix(in srgb,var(--t0) 55%,transparent);color:var(--t0)}
.badge.red{border-color:var(--red-line);color:var(--red);background:var(--red-soft)}

/* ---------- sticky toolbar ---------- */
.toolbar{position:sticky;top:var(--hdr);z-index:30;background:var(--bar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 0 10px;margin-bottom:16px}
.tb-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.tb-row+.tb-row{margin-top:10px}
.colpills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:-2px}
.colpills::-webkit-scrollbar{display:none}
.search{flex:1 1 260px;min-width:200px;display:flex;align-items:center;gap:9px;height:36px;padding:0 10px 0 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13px}
.search input::placeholder{color:var(--faint)}
.search kbd,.kbd{font:10px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:1px 5px;background:var(--bg)}
.sel{height:36px;border:1px solid var(--line);border-radius:4px;background:var(--paper);padding:0 28px 0 10px;font-size:12.5px;color:var(--ink);appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 14px) 15px,calc(100% - 10px) 15px;background-size:4px 4px;background-repeat:no-repeat}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;height:36px;background:var(--paper)}
.seg button{padding:0 11px;font-size:12px;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.fbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font-size:12.5px;color:var(--ink)}
.fbtn[aria-expanded="true"]{border-color:var(--ink)}
.fbtn .n{display:inline-grid;place-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:600 10px var(--mono)}
.count{margin-left:auto;font:11px var(--mono);color:var(--muted);white-space:nowrap}
.count b{color:var(--ink);font-weight:600}
.facets{display:grid;gap:9px;padding:12px 0 2px;margin-top:10px;border-top:1px dashed var(--line)}
.facet{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:start}
.facet-l{font:500 10px/30px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 6px 0 10px;border-radius:4px;background:var(--ink);color:var(--paper);font-size:12px}
.chip small{font:10px var(--mono);opacity:.65}
.chip button{display:grid;place-content:center;width:18px;height:18px;border-radius:3px;font-size:13px;opacity:.7}
.chip button:hover{opacity:1;background:color-mix(in srgb,var(--paper) 18%,transparent)}
.clear{font-size:12px;color:var(--red);padding:0 6px}
.clear:hover{text-decoration:underline}

/* ---------- comparison table ---------- */
.tbl{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow{display:grid;grid-template-columns:22px minmax(0,2.4fr) minmax(150px,1fr) 132px 74px 88px;gap:14px;align-items:center;width:100%;padding:11px 18px;border-top:1px solid var(--hair);text-align:left;transition:background .1s}
.trow:first-child{border-top:0}
.thead{padding:10px 18px;background:var(--wash);border-bottom:1px solid var(--line)}
.thead .th{font:500 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.thead button.th:hover{color:var(--ink)}
.thead .th[aria-sort]{color:var(--ink)}
.thead .th .ar{color:var(--red)}
.th.r{justify-content:flex-end}
button.trow:hover,.trow.cur{background:var(--wash)}
.trow.sel{background:var(--red-soft);box-shadow:inset 3px 0 var(--red)}
.c-main{min-width:0}
.c-title{font-size:14px;line-height:1.4;font-weight:500;overflow-wrap:anywhere}
.c-title mark{background:color-mix(in srgb,var(--red) 18%,transparent);color:inherit;border-radius:2px}
.c-sub{display:flex;flex-wrap:wrap;gap:0 0;margin-top:3px;min-width:0;overflow:hidden}
.c-pair{font:11.5px/1.5 var(--mono);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-val{text-align:right;min-width:0}
.c-val b{display:block;font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.c-val small{display:block;font:10px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-cov{text-align:right;font:11px var(--mono);color:var(--muted)}
.covbar{display:block;height:3px;border-radius:2px;background:var(--hair);margin-top:5px;overflow:hidden}
.covbar i{display:block;height:100%;background:var(--muted)}
.c-date{text-align:right;font:11px var(--mono);color:var(--faint)}
.tbl.compact .trow{padding-top:7px;padding-bottom:7px}
.tbl.compact .c-sub{display:none}
.tbl.compact .c-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl.compact .covbar{display:none}
.grp{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:12px 18px;border-top:1px solid var(--line);background:var(--wash);text-align:left}
.grp:first-child{border-top:0}
.grp:hover{background:var(--hair)}
.grp .chev{font:12px var(--mono);color:var(--faint);transition:transform .2s;text-align:center}
.grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.grp b{font-size:13.5px;font-weight:500}
.grp .gsub{font:10.5px var(--mono);color:var(--faint);margin-top:1px}
.grp .gright{display:flex;align-items:center;gap:12px;font:11px var(--mono);color:var(--muted)}
.minispark{display:flex;gap:1px;width:90px;height:5px;border-radius:2px;overflow:hidden;background:var(--hair)}
.minispark i{display:block;height:100%}
.empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:14px}
.empty .h3{margin-bottom:8px;color:var(--ink)}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.pages{display:flex;gap:4px;flex-wrap:wrap}
.pages button,.pages span{min-width:34px;height:34px;padding:0 9px;border:1px solid var(--line);border-radius:4px;font:12px var(--mono);color:var(--muted);background:var(--paper);display:grid;place-content:center}
.pages span{border-color:transparent;background:none}
.pages button:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.pages button[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pages button:disabled{opacity:.35;cursor:default}
.pager .note{font-family:var(--mono);font-size:11px}
.kbdhint{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font:10.5px var(--mono);color:var(--faint)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:80;width:min(620px,100%);display:flex;flex-direction:column;background:var(--paper);border-left:1px solid var(--line);box-shadow:-24px 0 80px -30px rgba(20,15,15,.25);transform:translateX(104%);transition:transform .32s cubic-bezier(.2,.7,.2,1)}
.drawer.on{transform:none}
.dw-top{display:flex;align-items:center;gap:8px;padding:12px 16px 12px 22px;border-bottom:1px solid var(--line)}
.dw-top .mono-note{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dw-body{flex:1;overflow-y:auto;padding:24px 26px 36px;overscroll-behavior:contain}
.dw-foot{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--wash)}
.dw-title{font-size:23px;line-height:1.25;letter-spacing:-.03em;font-weight:500;margin-top:10px;overflow-wrap:anywhere}
.dw-sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.65}
.dw-sec{margin-top:28px}
.dw-sec>h4{font:500 10px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;justify-content:space-between;gap:10px}
.dw-sec>h4 span{letter-spacing:.04em;text-transform:none}
.rows-dl{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:0 18px}
.rows-dl dt{font:10px/1.6 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:11px 0;border-bottom:1px solid var(--hair)}
.rows-dl dd{font-size:13.5px;line-height:1.75;color:var(--muted);padding:9px 0;border-bottom:1px solid var(--hair);min-width:0;overflow-wrap:anywhere}
.rows-dl dd b{color:var(--ink);font-weight:500}
.rows-dl dd.m{font:12px/1.7 var(--mono);color:var(--ink);overflow-wrap:anywhere}
.rows-dl dd ul{list-style:disc;padding-left:17px}
.rows-dl dd li+li{margin-top:3px}
.pairline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:14px;font:12px var(--mono)}
.plink{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;font:12px var(--mono);color:var(--ink);white-space:nowrap}
a.plink:hover{border-color:var(--ink)}
.mtab{display:grid;gap:0}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:4px 14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair)}
.mrow .ml{font-size:13px}
.mrow .ml small{display:block;font:10px var(--mono);color:var(--faint)}
.mrow .mv{text-align:right;font:500 13.5px var(--mono);font-variant-numeric:tabular-nums}
.mrow .mv small{display:block;font:400 10px var(--mono);color:var(--faint)}
.logtrk{grid-column:1/-1;position:relative;height:14px}
.logtrk::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--hair)}
.logtrk i{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--paper)}
.logtrk i.sq{border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
.logtrk em{position:absolute;top:50%;height:2px;transform:translateY(-50%);background:var(--line)}
.logax{display:flex;justify-content:space-between;font:9px var(--mono);color:var(--faint);padding-top:5px}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.side{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg)}
.side b{font-size:13px;font-weight:500}
.side .hw{font:10.5px var(--mono);color:var(--faint);margin-top:2px;word-break:break-all}
.kv{display:grid;grid-template-columns:minmax(80px,38%) minmax(0,1fr);gap:3px 12px;margin-top:9px;font:11px/1.6 var(--mono)}
.kv span:nth-child(odd){color:var(--faint)}
.kv span{overflow-wrap:anywhere}
.sgroup{margin-top:10px;padding-top:8px;border-top:1px solid var(--hair);font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.libs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.libs span{font:10px var(--mono);border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--muted);background:var(--paper)}
.evlist a{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair);font-size:13px;color:var(--ink)}
.evlist a span{color:var(--red)}
.evlist a:hover{color:var(--red)}
.notes li{position:relative;padding:8px 0 8px 16px;font-size:13px;line-height:1.75;color:var(--muted);border-bottom:1px solid var(--hair)}
.notes li::before{content:"";position:absolute;left:2px;top:17px;width:5px;height:5px;background:var(--faint)}
.stages{counter-reset:st}
.stage{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.stage>span{font:500 11px/1.9 var(--mono);color:var(--red)}
.stage b{display:block;font-size:13.5px;font-weight:500}
.stage p{font-size:13px;line-height:1.75;color:var(--muted);margin-top:2px}
.bigread{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-top:18px;padding:16px 18px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.bigread .b4{font:500 24px var(--mono);letter-spacing:-.03em;color:var(--muted);font-variant-numeric:tabular-nums}
.bigread .ar{color:var(--red);font-size:18px}
.bigread .af{font:500 30px var(--mono);letter-spacing:-.04em;color:var(--ink);font-variant-numeric:tabular-nums}
.bigread .fx{margin-left:auto;font:500 13px var(--mono);color:var(--red)}
.bigread small{flex-basis:100%;font:10.5px var(--mono);color:var(--faint)}

/* headline reading with the tier bands it is judged against */
.hread{padding:14px 0 2px}
.hv{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hv strong{font:500 34px/1 var(--mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hv span{font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.hv small{display:block;font:10.5px var(--mono);color:var(--faint);margin-top:3px}
.hscale{position:relative;height:30px;margin-top:16px}
.hscale::before{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:var(--line)}
.bands i{position:absolute;bottom:2px;height:9px;background:color-mix(in srgb,var(--c) 16%,transparent);border-left:1px solid var(--paper)}
.bands em{position:absolute;bottom:12px;left:3px;font:9px var(--mono);font-style:normal;color:var(--c);white-space:nowrap}
.hscale .mk{position:absolute;bottom:6px;width:12px;height:12px;border-radius:50%;transform:translate(-50%,50%);box-shadow:0 0 0 3px var(--paper)}
.hscale .mk.sq{border-radius:2px;transform:translate(-50%,50%) rotate(45deg)}
/* side-by-side diff of the two recorded configurations */
.dtab{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden;font:11.5px/1.55 var(--mono)}
.dt-sum{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--wash);border-bottom:1px solid var(--line);font:12.5px/1.5 var(--display);color:var(--muted)}
.dt-sum b{color:var(--red);font-weight:500}
.dt-row{display:grid;grid-template-columns:minmax(96px,.85fr) minmax(0,1fr) minmax(0,1fr);gap:10px;padding:6px 12px;border-top:1px solid var(--hair);align-items:start}
.dtab.one .dt-row{grid-template-columns:minmax(96px,.85fr) minmax(0,2fr)}
.dt-row>span{min-width:0;overflow-wrap:anywhere}
.dt-row .k{color:var(--muted)}
.dt-row .na{color:var(--faint)}
.dt-row.diff{background:var(--red-soft);box-shadow:inset 3px 0 var(--red)}
.dt-row.diff>span:not(.k){color:var(--ink);font-weight:500}
.dt-row.one{box-shadow:inset 3px 0 var(--t2)}
.dt-h{position:sticky;top:-24px;z-index:1;background:var(--paper);border-top:0;border-bottom:1px solid var(--line);font:500 12px/1.4 var(--display);color:var(--ink)}
.dt-h>span:first-child{font:500 10px/1.8 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.dt-h small{display:block;font:400 10px/1.5 var(--mono);color:var(--faint);margin-top:2px}
.dt-g{display:flex;justify-content:space-between;padding:9px 12px 5px;border-top:1px solid var(--line);font:500 10px/1.5 var(--mono);letter-spacing:.06em;color:var(--muted);background:var(--bg)}
.dt-g small{font-size:10px;color:var(--faint)}
.dtab[data-show="diff"] .dt-row.same,.dtab[data-show="diff"] .dt-g.allsame{display:none}

/* evidence card */
.evcard{padding:22px 24px 0;overflow:hidden}
.ev-h{margin-bottom:18px}
.ev-q,.ev-a{font-size:21px;font-weight:500;line-height:1.32;letter-spacing:-.025em}
.ev-a{color:var(--red);margin-top:1px}
.ev-a:empty{display:none}
.ev-meta{font:11px/1.6 var(--mono);color:var(--faint);margin-top:9px}
.ev-take{margin:20px 0 0;padding:3px 0 3px 16px;border-left:3px solid var(--red);font-size:15px;line-height:1.75;color:var(--ink)}
.ev-take b{font-weight:500;color:var(--red)}
.ev-how{margin:20px -24px 0;border-top:1px solid var(--hair)}
.ev-how summary{list-style:none;cursor:pointer;display:flex;gap:9px;align-items:center;padding:13px 24px;font-size:12.5px;color:var(--muted)}
.ev-how summary::-webkit-details-marker{display:none}
.ev-how summary::before{content:"▸";font-size:10px;color:var(--faint);transition:transform .2s}
.ev-how[open] summary::before{transform:rotate(90deg)}
.ev-how summary:hover{color:var(--ink)}
.ev-how-b{padding:0 24px 20px;font-size:13px;line-height:1.85;color:var(--muted)}
.ev-how-b p+p{margin-top:8px}
.ev-how-b b{color:var(--ink);font-weight:500}
.evcard>:last-child:not(.ev-how){margin-bottom:22px}
.evcard .figbox{padding:0;border:0}
.evcard .cmptbl{margin:0 -24px;border-top:1px solid var(--line)}
.evcard .fp{padding:0;background:none;border:0;box-shadow:none}
/* repair drawer: before | after twin panels on one grid */
.twin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:10px;margin-top:12px}
.tw-c{min-width:0;padding:9px 14px;border-left:1px solid var(--line);border-right:1px solid var(--line);overflow-wrap:anywhere}
.tw-c.b{background:var(--wash)}
.tw-c.a{background:var(--paper)}
.tw-c.h{padding-top:13px;border-top:1px solid var(--line);border-radius:8px 8px 0 0}
.tw-c.h b{display:block;font-size:15px;font-weight:500}
.tw-c.end{padding-bottom:14px;border-bottom:1px solid var(--line);border-radius:0 0 8px 8px}
.tw-c.m{border-top:1px solid var(--hair)}
.tw-c.m small{display:block;font-size:11.5px;line-height:1.5;color:var(--muted)}
.tw-c.a.m small{color:var(--faint)}
.tw-c.m strong{display:block;margin-top:3px;font:500 17px/1.3 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tw-c.m.hd strong{font-size:25px}
.tw-c.m em{display:block;margin-top:2px;font:10.5px/1.5 var(--mono);font-style:normal;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.how-header{padding-top:40px}
.how-header .h1{max-width:none}
.how-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-block:1px solid var(--line);margin-top:22px}
.how-steps a{display:flex;align-items:center;gap:9px;height:100%;min-height:46px;padding:8px 10px;font-size:13px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.how-steps a:hover{color:var(--red);background:var(--red-soft)}
.how-steps span{flex:none;color:var(--red);font:500 11px var(--mono)}
.how-chapter-title{display:flex;align-items:baseline;gap:12px;font-size:30px;font-weight:650;line-height:1.25}
.how-chapter-number{flex:none;color:var(--red);font:500 13px var(--mono)}
#v-how .sec{padding-top:52px}
@media(max-width:1000px){.how-steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){
  .how-header{padding-top:28px}
  .how-steps{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:16px}
  #v-how .sec{padding-top:38px}
}
/* folded lists */
.fold summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--hair)}
.fold summary::-webkit-details-marker{display:none}
.fold .fl{font-size:12.5px;color:var(--red);white-space:nowrap}
.fold .fl::before{content:"▸ ";font-size:10px}
.fold[open] .fl::before{content:"▾ "}
.fold .fl b{font-weight:400}
.fold .fl .o,.fold[open] .fl .c{display:none}
.fold[open] .fl .o{display:inline}
.fold .fp{font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open] .fp{visibility:hidden}
.rows-dl dd .fold summary{padding:0;border-bottom:0}
.rows-dl dd ul.notes{list-style:none;padding-left:0;margin-top:6px}
.rows-dl dd .fold .notes li:last-child{border-bottom:0}
/* cite */
.cite{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:14px;align-items:stretch}
.cite-meta{display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:20px 22px}
.spec2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 20px;font-size:13.5px}
.spec2 dt{font:500 10px/2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.spec2 dd{color:var(--ink);overflow-wrap:anywhere}
.spec2 dd.mono{font-size:12.5px}
.cite-dl{display:flex;flex-wrap:wrap;gap:8px}
.cite-code{display:flex;flex-direction:column;overflow:hidden}
.cc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px 10px 16px;background:var(--wash);border-bottom:1px solid var(--line)}
.cc-top .seg{height:30px}
.cite pre{margin:0;flex:1;padding:16px 18px;font:12px/1.75 var(--mono);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.cc-note{padding:0 18px 14px}
.foot-links{display:flex;gap:18px}

/* glossary terms */
.term{border-bottom:1px dotted color-mix(in srgb,currentColor 70%,transparent);cursor:help}
.term:hover{border-bottom-style:solid}
.term:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:2px}
.tip .tdef{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.75}
.tip .tdef b{display:inline;font-size:inherit;color:var(--ink)}


/* ---------- how: animated principle page (inference-rsi demo frame) ---------- */
:root{--node:#3f3c43;--node-fg:#fff;--node-2:#9a959e;--cellbg:#e6e2db}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--node:#e4e1dc;--node-fg:#17181c;--node-2:#7d7a82;--cellbg:#26272c}}
:root[data-theme="dark"]{--node:#e4e1dc;--node-fg:#17181c;--node-2:#7d7a82;--cellbg:#26272c}
.how-note{max-width:72ch;margin:12px 0 16px;color:var(--muted)}
.how-note > p + p{margin-top:6px}
.how-request dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.how-match .dm-h{flex-direction:row;align-items:center;gap:8px}
.how-match dl{grid-template-columns:repeat(2,minmax(0,1fr))}
.how-request dt{color:var(--muted);font-size:12px}
.how-request dd{margin-top:3px;font-weight:500;overflow-wrap:anywhere}
.how-readings{margin-top:40px}
.dm{padding:20px 22px 14px}
.dm-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.dm-ctl{display:flex;gap:8px;flex:none}
.dm[data-playing="true"] .dm-play{background:var(--red);border-color:var(--red);color:#fff}
.dm-steps{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:5px}
.dm-steps button{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--muted);font-size:12.5px;line-height:1.3;text-align:center}
.dm-steps button span{font:10.5px var(--mono);opacity:.7}
.dm-steps button:hover{color:var(--ink);border-color:var(--ink)}
.dm-steps button[aria-current="step"]{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
.dm-steps button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--red);transform-origin:left;transform:scaleX(var(--p,0))}
.dm-cap{margin:12px 0 16px;min-height:3.5em;font-size:14.5px;line-height:1.75;color:var(--ink)}
.dm-cap b{font-weight:500;color:var(--red)}
.dm-stage{position:relative}
.dm-leg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--hair);font:10.5px var(--mono);color:var(--muted)}
.dm-leg>span{display:inline-flex;gap:6px;align-items:center}
.dm-ill{margin-left:auto;color:var(--faint)!important}
.dm.snap *,.dm.snap *::before,.dm.snap *::after{transition:none!important}
.lg{display:inline-block;width:12px;height:12px;border-radius:2px;flex:none}
.lg.op-l.done{background:var(--node)} .lg.op-l.run{background:var(--paper);border:1.5px solid var(--red)}
.lg.cell-l.pf{background:var(--node)} .lg.cell-l.pf2{background:color-mix(in srgb,var(--node) 58%,var(--cellbg))} .lg.cell-l.dc{background:var(--node-2)} .lg.cell-l.now{background:var(--red)}
.lg.cell-l.padl{background:repeating-linear-gradient(135deg,var(--wash) 0 3px,var(--cellbg) 3px 6px);border:1px solid var(--line)}
.lg.cell-l.leakl{background:var(--red-soft);border:1px solid var(--red)} .lg.cell-l.okl{border:1px solid var(--t0)}
.lg.hist-l{background:color-mix(in srgb,var(--ink) 16%,transparent)}
.lane{border:1px solid var(--line);border-radius:6px;background:var(--wash);padding:12px;min-width:0}
.lane-h{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.lane-h b{font-size:14px;font-weight:500}
.lane-h small{font:10px/1.5 var(--mono);color:var(--faint)}
/* measured box */
.dm-meas{margin-top:14px;padding:16px 18px 18px;border:1px solid color-mix(in srgb,var(--red) 22%,var(--line));border-radius:10px;background:color-mix(in srgb,var(--red) 2.5%,var(--paper))}
.dm-ml{display:flex;gap:12px;align-items:baseline;margin-bottom:12px;font:10.5px var(--mono);color:var(--faint)}
.dm-ml b{flex:none;font-weight:600;letter-spacing:.12em;color:var(--red)}
.dm-meas .trk i{width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.dm-meas.in .trk i{width:var(--w)}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mstats div{border-left:1px solid var(--line);padding-left:16px}
.mstats div:first-child{border-left:0;padding-left:0}
.mstats b{display:block;font:500 clamp(24px,2.6vw,36px)/1.1 var(--display);letter-spacing:-.04em;color:var(--red);font-variant-numeric:tabular-nums}
.mstats span{display:block;margin-top:6px;font-size:12.5px;color:var(--muted)}
.mrows{display:grid;gap:2px}
.mrow2{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto 84px;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13px}
.mrow2 b{font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.mrow2 b.b{color:var(--faint)} .mrow2 b.a{color:var(--t0)} .mrow2 i{font-style:normal;color:var(--red)}
.mrow2 em{font:11px var(--mono);font-style:normal;color:var(--t0);text-align:right}
.mstages{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 12px}
.mstages span{display:inline-flex;gap:7px;align-items:center;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font-size:12px}
.mstages i{font:10px var(--mono);font-style:normal;color:var(--red)}
/* 01 pair */
.pa-in{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.pa-box{display:flex;flex-direction:column;gap:7px;align-items:center;padding:10px 16px;border:1px solid var(--line);border-radius:6px;background:var(--wash);transition:border-color .3s,box-shadow .3s}
.pa-box.hot{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.pa-box small{font:10px var(--mono);letter-spacing:.06em;color:var(--faint)}
.pa-box b{font:500 12px var(--mono)}
.tok{display:flex;gap:3px}
.tok i{width:14px;height:14px;border-radius:2px;background:var(--cellbg);transition:background .25s}
.tok i.on{background:var(--node)}
.pa-wire{display:block;width:100%;height:44px;overflow:visible}
.pa-wire path{fill:none;vector-effect:non-scaling-stroke}
.pa-wire .base{stroke:var(--line);stroke-width:1.5}
.pa-wire .pulse{stroke:var(--red);stroke-width:2.5;stroke-dasharray:8 200;stroke-linecap:round;opacity:0}
.pa-lanes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1fr);gap:12px}
.ops{display:flex;align-items:center;gap:3px;margin-bottom:12px}
.op{flex:1;min-width:0;text-align:center;padding:7px 2px;border-radius:4px;background:var(--cellbg);color:var(--muted);font:11px var(--mono);border:1px solid transparent;white-space:nowrap;overflow:hidden;transition:background .3s,color .3s,box-shadow .3s,border-color .3s}
.op.run{background:var(--paper);color:var(--red);border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft),0 0 14px color-mix(in srgb,var(--red) 28%,transparent)}
.op.done{background:var(--node);color:var(--node-fg)}
.op-ar{font-style:normal;color:var(--faint);font-size:12px}
.vgrid,.dgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.vgrid i,.dgrid i{aspect-ratio:1;border-radius:2px;background:var(--cellbg);transition:background .35s,box-shadow .2s,transform .2s}
.vgrid i.on{background:color-mix(in srgb,var(--node) var(--v),var(--cellbg))}
.dgrid i.on{background:color-mix(in srgb,var(--c) 78%,var(--cellbg))}
.dgrid i.scan{box-shadow:0 0 0 2px var(--ink);transform:scale(1.15);position:relative;z-index:1}
.dgrid i.max{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--red),0 0 14px var(--red);transform:scale(1.2);position:relative;z-index:1}
.lane-f{margin-top:8px;font:10px var(--mono);color:var(--faint)}
.pa-mid{border:1px dashed var(--line);border-radius:6px;padding:12px;min-width:0;background:var(--paper)}
.pa-read{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;margin-top:12px;font:11px var(--mono)}
.pa-read dt{color:var(--faint)}
.pa-read dd{margin:0;text-align:right;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pa-read dd.hit{color:var(--red);font-size:15px}
.pa-rec{margin-top:14px;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.pa-rec.on{opacity:1;transform:none}
/* 02 axis */
.rcs{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.rc{display:flex;flex-direction:column;gap:4px;min-width:0;margin:0 4px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--wash);opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s,border-color .3s,box-shadow .3s}
.rc.on{opacity:1;transform:none}
.rc.lit{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
.rc-m{font:10px/1.5 var(--mono);color:var(--faint)}
.rc-v{font:500 18px var(--mono);letter-spacing:-.02em;overflow-wrap:anywhere}
.rc-x{font:11px var(--mono);color:var(--red);opacity:0;transition:opacity .4s;min-height:1.6em}
.rc.x .rc-x{opacity:1}
.rc-t{align-self:flex-start;padding:1px 7px;border-radius:999px;border:1px solid var(--line);font:10px/1.6 var(--mono);color:var(--muted);opacity:0;transition:opacity .4s,border-color .4s,color .4s}
.rc.t .rc-t{opacity:1;border-color:var(--tc);color:var(--tc)}
.rc-s{font-size:11px;line-height:1.4;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.axa{position:relative;height:196px;margin:6px 4px 0}
.axa .bands i{position:absolute;bottom:50px;height:140px;background:color-mix(in srgb,var(--c) 10%,transparent);border-left:1px solid var(--paper);opacity:0;transition:opacity .5s}
.axa.bd .bands i{opacity:1}
.axa .bands em{position:absolute;top:4px;left:5px;font:9.5px var(--mono);font-style:normal;color:var(--c);white-space:nowrap}
.axa .hist i{position:absolute;bottom:51px;width:3.4%;height:var(--h);transform:translateX(-50%) scaleY(var(--g,0));transform-origin:bottom;background:color-mix(in srgb,var(--ink) 15%,transparent);border-radius:2px 2px 0 0}
.axa .line{position:absolute;left:0;right:0;bottom:50px;height:1px;background:var(--ink)}
.axa .zero-sep{position:absolute;bottom:42px;height:16px;border-left:1px dashed var(--faint)}
.axa .ticks i{position:absolute;bottom:22px;transform:translateX(-50%);font:9.5px var(--mono);font-style:normal;color:var(--faint);white-space:nowrap}
.axa .dot{position:absolute;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--paper);opacity:0;z-index:2}
.axa .dot.sq{border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
.ax-cap{position:absolute;bottom:4px;right:0;font:10px var(--mono);color:var(--faint)}
/* 03 order */
.oc-lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.strip{display:grid;grid-template-columns:repeat(32,minmax(0,1fr));gap:2px}
.strip i{aspect-ratio:1;border-radius:1.5px;background:var(--cellbg);transition:background .25s}
.strip i.pf{background:var(--node)}
.strip i.pf2{background:color-mix(in srgb,var(--node) 58%,var(--cellbg))}
.strip i.dc{background:var(--node-2)}
.strip i.now{background:var(--red);box-shadow:0 0 6px var(--red)}
.oc-meta{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font:10.5px var(--mono);color:var(--muted)}
.oc-meta b{color:var(--ink);font-weight:500}
.oc-ph{color:var(--faint)}
.oc-read{min-height:1.7em;margin-top:4px;font:10.5px/1.7 var(--mono);color:var(--red);opacity:0;transition:opacity .3s}
.oc-read.on{opacity:1}
.acc{margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font:13px/1.95 var(--mono)}
.acc .ah{font:10px/1.6 var(--mono);color:var(--faint);margin-bottom:4px}
.acc p{opacity:0;transform:translateX(-6px);transition:opacity .3s,transform .3s;white-space:nowrap}
.acc p.on{opacity:1;transform:none}
.acc .post{display:none} .acc p.rnd .pre{display:none} .acc p.rnd .post{display:inline}
.acc s{color:var(--faint)}
.acc .rd,.acc .ex{font-size:10.5px;margin-left:6px}
.acc .rd{color:var(--red)} .acc .ex{color:var(--t0)}
.acc .res{font-size:17px;font-weight:600}
.oc-delta{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:8px 22px;margin-top:12px;padding:12px 16px;border:1px dashed var(--red-line);border-radius:6px;text-align:center;opacity:0;transition:opacity .4s}
.oc-delta.on{opacity:1}
.oc-d1{font-size:14px} .oc-d1 b{font:600 18px var(--mono);color:var(--red)}
.oc-d2{display:none;font-size:13px;color:var(--muted)}
.oc-delta.meas .oc-d2{display:inline}
.oc-d2 strong{font:500 24px var(--mono);color:var(--red);margin-left:8px;font-variant-numeric:tabular-nums}
.oc-d2 small{display:block;font:10.5px var(--mono);color:var(--faint);margin-top:2px}
/* 04 repair */
.rp-lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rp-lane.fix{border-color:color-mix(in srgb,var(--t0) 45%,var(--line))}
.rp-grid{position:relative;display:grid;grid-template-columns:82px repeat(6,minmax(0,1fr));gap:5px;align-items:center}
.rp-grid .rl{font:10px/1.35 var(--mono);color:var(--faint)}
.rp-grid .c{height:32px;display:grid;place-content:center;border-radius:4px;border:1px solid var(--line);background:var(--paper);font:11px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s,background .3s,color .3s,border-color .3s}
.rp-grid .c.on{opacity:1}
.rp-grid .c.pad{background:repeating-linear-gradient(135deg,var(--wash) 0 5px,var(--cellbg) 5px 10px);color:var(--faint)}
.rp-grid .c.leak{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:600}
.rp-grid .c.ok{border-color:var(--t0);color:var(--t0);font-weight:600}
.rp-grid .c.tint{background:color-mix(in srgb,var(--red) calc(var(--k) * 26%),var(--paper));border-color:color-mix(in srgb,var(--red) calc(var(--k) * 80%),var(--line));color:color-mix(in srgb,var(--red) calc(var(--k) * 100%),var(--ink))}
.rp-sweep{position:absolute;border:2px solid var(--red);border-radius:6px;pointer-events:none;opacity:0;transition:opacity .2s}
.rp-mask{display:inline-block;margin-left:4px;padding:0 5px;border-radius:3px;background:var(--t0);color:#fff;font:9.5px/1.6 var(--mono);opacity:0;transition:opacity .3s}
.rp-foot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);opacity:0;transition:opacity .4s}
.rp-foot.on{opacity:1}
.rp-foot strong{font:500 22px var(--mono)}
.rp-lane.bug .rp-foot strong{color:var(--red)} .rp-lane.fix .rp-foot strong{color:var(--t0)}
@media (max-width:860px){
  .dm{padding:16px 14px 12px}
  .dm-h{flex-direction:column}
  .dm-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dm-steps button{font-size:11.5px}
  .pa-lanes,.oc-lanes,.rp-lanes{grid-template-columns:1fr}
  .pa-wire{display:none}
  .pa-in{margin-bottom:12px}
  .axa .ticks i:nth-child(2){display:none}
  .rcs{grid-template-columns:repeat(var(--n),minmax(118px,1fr));overflow-x:auto;padding-bottom:4px}
  .axa .bands em{display:none}
  .mstats{grid-template-columns:1fr}
  .mstats div{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px}
  .mstats div:first-child{border-top:0;padding-top:0}
  .mrow2{grid-template-columns:minmax(0,1fr) auto auto auto;}
  .mrow2 em{display:none}
  .rp-grid{grid-template-columns:62px repeat(6,minmax(0,1fr));gap:3px}
  .rp-grid .c{font-size:10px;height:28px}
  .dm-ill{margin-left:0}
}
@media (max-width:760px){.how-request dl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.how-match dl{grid-template-columns:1fr}.how-readings{margin-top:28px}}


/* ---------- how: framework overview (team flow diagram, animated) ---------- */
.ico{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.eb{font-size:14px;margin-right:2px}
.ico.sm{font-size:13px;margin-right:5px;vertical-align:-2px}
.fw-flow{display:grid;grid-template-columns:minmax(0,.96fr) 28px minmax(0,1.56fr) 28px minmax(0,.96fr);grid-template-areas:"target to-core core to-deliver deliver" ". . links . ." "kb kb kb kb kb"}
.fw-p[data-p="target"]{grid-area:target}
.fw-p[data-p="core"]{grid-area:core}
.fw-p[data-p="deliver"]{grid-area:deliver}
.fw-ar[data-a="0"]{grid-area:to-core}
.fw-ar[data-a="1"]{grid-area:to-deliver}
.fw-p{display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--paper);transition:border-color .3s,box-shadow .3s}
.fw-p.u{--pc:var(--red);--pc-soft:var(--red-soft);--pc-line:var(--red-line)}
.fw-p.s{--pc:var(--t0);--pc-soft:color-mix(in srgb,var(--t0) 9%,var(--paper));--pc-line:color-mix(in srgb,var(--t0) 28%,var(--line))}
.fw-p.on{border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 14%,transparent)}
.fw-h{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--pc-soft);border-bottom:1px solid var(--pc-line);font-size:15px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.fw-h>.ico{font-size:19px;color:var(--pc)}
.fw-bar{width:2px;align-self:stretch;margin:2px 0;border-radius:1px;background:var(--pc);flex:none}
.fw-sub{margin-left:auto;font:10.5px var(--mono);font-weight:400;color:var(--muted);white-space:nowrap}
.fw-b{display:flex;flex-direction:column;gap:9px;flex:1;padding:12px}
.fw-it{display:flex;align-items:center;gap:9px;min-width:0;padding:8px 10px;border:1px solid var(--hair);border-radius:9px;background:var(--paper);transition:opacity .35s,border-color .35s,box-shadow .35s}
.fw-it.t,.fw-it.d{flex:1;padding:10px 12px;gap:10px;opacity:.4}
.fw-it.t .fw-bar,.fw-it.d .fw-bar{height:28px;align-self:center;margin:0}
.fw-it.on{opacity:1;border-color:var(--line)}
.fw-it>.ico{font-size:17px;color:var(--pc)}
.fw-it .k{font-size:13px;font-weight:500;white-space:nowrap}
.fw-kv{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.fw-kv .k{font:500 10.5px/1.35 var(--mono);letter-spacing:.03em;color:var(--muted)}
.fw-kv .v{font:500 13.5px/1.35 var(--display);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fw-foot{margin:0 12px 12px;padding:7px 6px;border-radius:8px;background:color-mix(in srgb,var(--t0) 9%,var(--paper));font:10.5px/1.4 var(--mono);text-align:center;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.4;transition:opacity .35s}
.fw-foot.on{opacity:1;color:var(--ink)}
.fw-ar{display:grid;place-items:center;color:var(--line);transition:color .3s}
.fw-ar .ico{font-size:20px;stroke-width:2.2}
.fw-ar.on{color:var(--ink)}
.fw-ar.go{color:var(--red)}
.fw-ar.go .ico{animation:fw-nudge .5s ease-in-out infinite alternate}
@keyframes fw-nudge{to{transform:translateX(4px)}}
.fw-p[data-p="core"] .fw-h{display:grid;grid-template-columns:auto auto minmax(0,1fr) minmax(0,max-content);white-space:normal}
.fw-slot{display:grid}
.fw-slot>*{grid-area:1/1}
.fw-slot>[aria-hidden="true"]{visibility:hidden}
.fw-status{justify-items:end;text-align:center}
.fw-round,.fw-miss{align-self:center;font:10.5px var(--mono);font-weight:400;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--paper)}
.fw-round.on{border-color:var(--red-line);color:var(--red)}
.fw-miss{border-color:var(--pc-line);color:var(--t0)}
.fw-stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.fw-st{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.fw-st+.fw-st::before{content:"›";position:absolute;left:-12px;top:22px;font-size:18px;line-height:1;color:var(--faint)}
.fw-tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;border:1px solid var(--line);border-radius:11px;background:var(--paper);transition:border-color .3s,box-shadow .3s}
.fw-tile .ico{font-size:26px;color:var(--red)}
.fw-st:last-child .fw-tile .ico{color:var(--t0)}
.fw-tile b{font-size:14px;font-weight:500;white-space:nowrap}
.fw-st.run .fw-tile{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft),0 0 18px color-mix(in srgb,var(--red) 24%,transparent)}
.fw-st.done .fw-tile{border-color:color-mix(in srgb,var(--t0) 50%,var(--line))}
.fw-res{min-height:112px;padding:8px 9px;border:1px dashed var(--line);border-radius:8px;font-size:11.5px;line-height:1.6;color:var(--muted);overflow-wrap:anywhere;opacity:0;transition:opacity .35s}
.fw-res.on{opacity:1}
.fw-res b{font-family:var(--mono);font-weight:500;color:var(--red)}
.fw-res code{font:10.5px var(--mono);color:var(--ink)}
.fw-loop{position:relative;height:28px;margin:12px 12.5% 8px;border:1.5px solid var(--line);border-top:0;border-radius:0 0 11px 11px;transition:border-color .3s}
.fw-loop::before{content:"";position:absolute;left:-6.5px;top:-3px;width:11px;height:11px;border-left:1.5px solid currentColor;border-top:1.5px solid currentColor;transform:rotate(45deg);color:var(--line);transition:color .3s}
.fw-loop.on{border-color:var(--red)}
.fw-loop.on::before{color:var(--red)}
.fw-loop span{z-index:1;position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);padding:0 10px;background:var(--paper);font-size:12.5px;color:var(--ink);white-space:nowrap}
.fw-loop i{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);opacity:0}
.fw-lp{grid-area:links;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:12px;min-height:56px;padding-inline:clamp(12px,12%,54px) clamp(8px,4%,22px)}
.fw-lk{display:grid;grid-template-columns:2px minmax(0,1fr);align-items:center;gap:9px;font-size:12.5px;font-weight:500;overflow-wrap:anywhere}
.fw-lk.up{color:var(--t0)}
.fw-lk.down{color:var(--muted)}
.fw-lk .ln{position:relative;width:2px;height:100%;background:currentColor}
.fw-lk.down .ln{background:repeating-linear-gradient(var(--muted) 0 5px,transparent 5px 10px)}
.fw-lk .ln::after{content:"";position:absolute;left:50%;width:8px;height:8px;border:solid currentColor;border-width:2px 0 0 2px;transform:translateX(-50%) rotate(45deg)}
.fw-lk.up .ln::after{top:1px}
.fw-lk.down .ln::after{bottom:1px;transform:translateX(-50%) rotate(225deg)}
.fw-lk .ln i{position:absolute;left:50%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);opacity:0}
.fw-lk.up .ln i{background:var(--t0);box-shadow:0 0 10px var(--t0)}
.fw-lk.down .ln i{background:var(--red);box-shadow:0 0 10px var(--red)}
.fw-kb{grid-area:kb}
.fw-kbrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.fw-it.k{position:relative;justify-content:center;overflow:visible}
.fw-it.k.hit{border-color:var(--t0);box-shadow:0 0 0 3px color-mix(in srgb,var(--t0) 16%,transparent)}
.fw-it.k .k{white-space:normal;overflow-wrap:anywhere}
.fw-it.k em{position:absolute;top:-9px;right:2px;padding:1px 6px;border-radius:999px;background:var(--red);color:#fff;font:10px/1.5 var(--mono);font-style:normal;opacity:0;transform:scale(.6);transition:opacity .3s,transform .3s}
.fw-it.k.add em{opacity:1;transform:none}
.fw-kb .fw-b{overflow:visible}
.lg.fw-l.u{background:var(--red-soft);border:1px solid var(--red)}
.lg.fw-l.s{background:color-mix(in srgb,var(--t0) 12%,var(--paper));border:1px solid var(--t0)}
/* chain of records */
.chain{display:grid}
.chain-r{display:grid;grid-template-columns:30px 118px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:10px 4px;border-bottom:1px solid var(--hair);text-align:left}
.chain-r:last-child{border-bottom:0}
.chain-r:hover{background:var(--wash)}
.cr-n{font:11px var(--mono);color:var(--red)}
.cr-l{font:10.5px var(--mono);color:var(--muted)}
.cr-t{min-width:0;font-size:13.5px}
.cr-t small{display:block;font:10.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-v{text-align:right;font:500 13px var(--mono);color:var(--faint);white-space:nowrap}
.cr-v b{font-weight:500;color:var(--t0)} .cr-v i{font-style:normal;color:var(--red)}
.cr-v small{display:block;font:400 10px var(--mono);color:var(--faint)}
/* knowledge base & delivery */
.kbx{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.kbx-b{display:grid;gap:8px;padding:12px}
.kbx-it{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--hair);border-radius:10px}
.kbx-it>.ico{font-size:20px;color:var(--pc)}
.kbx-it b{display:block;font-size:14px;font-weight:500}
.kbx-it small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
@media (max-width:1100px){
  .fw-flow{grid-template-columns:minmax(0,1fr);grid-template-areas:"target" "to-core" "core" "links" "kb" "deliver"}
  .fw-p[data-p="target"] .fw-b,.fw-p[data-p="deliver"] .fw-b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .fw-ar{height:46px}
  .fw-ar .ico{rotate:90deg}
  .fw-ar[data-a="1"]{display:none}
  .fw-lp{width:min(100%,420px);justify-self:center}
  .fw-p[data-p="deliver"]{margin-top:20px}
  .kbx{grid-template-columns:1fr}
}
@media (max-width:680px){
  .fw-p[data-p="target"] .fw-b,.fw-p[data-p="deliver"] .fw-b{grid-template-columns:1fr}
}
@media (max-width:860px){
  .fw-stages{grid-template-columns:1fr;gap:8px}
  .fw-st{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px}
  .fw-st+.fw-st::before{display:none}
  .fw-tile{padding:10px 4px}
  .fw-res{min-height:76px}
  .fw-loop{margin:12px 8% 12px}
  .fw-kbrow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fw-kbrow .fw-it{padding:8px 6px;gap:6px}
  .fw-kbrow .k{font-size:12px}
  .fw-h{font-size:14.5px;flex-wrap:wrap;white-space:normal}
  .chain-r{grid-template-columns:24px minmax(0,1fr) auto}
  .cr-l{display:none}
}


/* ---------- figure texture, aligned with inference-rsi's demo frames ---------- */
:root{--fig:#fffdfa;--fig-2:#f8f6f2;--fig-line:#d7d2cc;--fig-in:#d6d1cb;--fig-hl:#fffafa;--fig-hl-line:#cd929b;--fig-lab:#544a52;--meas-bg:#fffafa;--meas-line:#e3d4d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fig:#141518;--fig-2:#1a1b1f;--fig-line:#2f3036;--fig-in:#34353b;--fig-hl:#1d1517;--fig-hl-line:#6b2f39;--fig-lab:#a39aa1;--meas-bg:#1a1416;--meas-line:#4a2b31}}
:root[data-theme="dark"]{--fig:#141518;--fig-2:#1a1b1f;--fig-line:#2f3036;--fig-in:#34353b;--fig-hl:#1d1517;--fig-hl-line:#6b2f39;--fig-lab:#a39aa1;--meas-bg:#1a1416;--meas-line:#4a2b31}
.dm{background:var(--fig);border-color:var(--fig-line);padding:22px 22px 18px}
.dm .ev-q,.dm .ev-a{font-size:24px;line-height:1.25;letter-spacing:-.03em}
#dmFlow .ev-a{margin-top:5px;color:var(--muted);font-size:13px;font-weight:400;line-height:1.5;letter-spacing:0}
.dm-cap{font-weight:500;font-size:15px}
#dmFlow .dm-cap{min-height:0}
.dm-steps button{background:var(--fig);border-color:#ded9d2}
.lane{background:var(--fig-2);border-color:var(--fig-in);border-radius:6px;padding:10px}
.lane.hl,.rp-lane.fix{background:var(--fig-hl);border-color:var(--fig-hl-line)}
.lane-h{justify-content:space-between;align-items:baseline;gap:10px;min-height:24px;margin-bottom:8px}
.lane-h b{font-size:19px;font-weight:500;letter-spacing:-.025em;line-height:1.2}
.lane-h .dot{align-self:center}
.lane-h small{margin-left:auto;font:11px var(--mono);color:var(--muted)}
.mlab{margin:10px 0 6px;font:11px/1.4 var(--mono);letter-spacing:.035em;color:var(--fig-lab)}
.chips3{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 4px}
.chips3 span{padding:2px 8px;border:1px solid var(--fig-in);border-radius:4px;background:var(--fig);font-size:12.5px;line-height:1.5;color:var(--ink)}
.chips3 span.bad{border-color:var(--red-line);background:var(--red-soft);color:var(--red)}
.chips3 span.n{color:var(--muted)}
.pa-mid{background:var(--fig);border-color:var(--fig-in)}
.dm-leg{border-top:0;padding-top:4px;margin-top:12px;font:13px/18px var(--display);color:var(--muted)}
.dm-ill{font:11px var(--mono)}
.dm-meas{background:var(--meas-bg);border-color:var(--meas-line);border-radius:10px}
.dm .dm-meas{margin:18px 0 2px}
.dm-ml b{font:600 11px/1.4 var(--mono);letter-spacing:.1em}
.dm-ml span{letter-spacing:.02em}
.fw-p{border-radius:6px;border-color:var(--fig-in);background:var(--fig-2)}
.fw-p.s .fw-h,.fw-p.u .fw-h{background:transparent;border-bottom-color:var(--fig-in)}
.fw-p[data-p="core"]{background:var(--fig)}
.fw-it{background:var(--fig);border-color:var(--fig-in)}
.evcard{background:var(--fig);border-color:var(--fig-line)}
/* factory-style stack + arc for the framework loop */
.fx{position:relative;display:grid;grid-template-rows:repeat(3,1fr 16px) 1fr auto;padding-left:26px}
.fx-st{display:grid;grid-template-columns:2ch 98px minmax(0,1fr);gap:4px 10px;align-items:center;min-height:56px;padding:9px 11px;border:1px solid var(--fig-in);border-radius:4px;background:var(--fig);transition:border-color .3s,box-shadow .3s,background .3s}
.fx-n{font:11px var(--mono);color:var(--faint)}
.fx-k{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--mono);letter-spacing:.06em;color:var(--ink);white-space:nowrap}
html[lang="en"] .fx-k{letter-spacing:.03em}
.fx-k .ico{font-size:15px;color:var(--red)}
.fx-st:nth-of-type(4) .fx-k .ico{color:var(--t0)}
.fx-d{grid-column:3;font-size:12.5px;line-height:1.55;color:var(--muted);overflow-wrap:anywhere}
.fx-d>span{align-self:center}
.fx-d.on{color:var(--ink)}
.fx-d b{font-family:var(--mono);font-weight:500;color:var(--red)}
.fx-d code{font:11px var(--mono)}
.fx-st.run{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft),0 0 18px color-mix(in srgb,var(--red) 22%,transparent)}
.fx-st.run .fx-n{color:var(--red)}
.fx-st.done{border-color:color-mix(in srgb,var(--t0) 45%,var(--fig-in))}
.fx-ar{justify-self:center;height:16px;font-style:normal;font-size:12px;line-height:16px;color:var(--faint)}
.fx-arc{position:absolute;left:4px;width:16px;border:1.5px solid var(--faint);border-right:0;border-radius:7px 0 0 7px;pointer-events:none;transition:border-color .3s}
.fx-arc::after{content:"";position:absolute;right:-1px;top:-5px;border:4.5px solid transparent;border-left:6px solid var(--faint);border-right:0;transition:border-color .3s}
.fx-arc.on{border-color:var(--red)}
.fx-arc.on::after{border-left-color:var(--red)}
.fx-arc i{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);opacity:0}
.fx-gate{justify-self:center;align-items:center;margin-top:12px;padding:4px 12px;border:1px dashed var(--fig-in);border-radius:999px;font:11px/1.6 var(--mono);letter-spacing:.04em;text-align:center;color:var(--muted);transition:color .3s,border-color .3s}
.fx-gate[data-g="1"]{color:var(--red);border-color:var(--red-line)}
.fx-gate[data-g="2"]{color:var(--t0);border-color:color-mix(in srgb,var(--t0) 50%,var(--fig-in))}
@media (max-width:860px){
  .fx-st{grid-template-columns:22px minmax(0,1fr)}
  .fx-d{grid-column:1/-1}
  .dm .ev-q,.dm .ev-a{font-size:19px}
  .lane-h b{font-size:17px}
}


/* ---------- report page ---------- */
.sel4{display:grid;gap:0;margin-top:26px;border:1px solid var(--fig-line,var(--line));border-radius:10px;background:var(--fig,var(--paper));overflow:hidden}
.st4{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:start;padding:14px 18px;border-top:1px solid var(--hair)}
.st4:first-child{border-top:0}
.st4-h{display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 6px;align-items:baseline}
.st4-n{grid-row:span 2;font:500 12px/1.6 var(--mono);color:var(--faint)}
.st4.done .st4-n{color:var(--red)}
.st4-h b{font-size:15px;font-weight:500}
.st4-h small{font:10.5px/1.5 var(--mono);color:var(--faint)}
.st4 .pills{gap:6px}
.scope{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rep{margin-top:22px}
.rp-empty{padding:40px 20px 34px;text-align:center}
.rp-empty .h3{margin-bottom:6px}
.rp-ph{padding:22px;font-size:13.5px;color:var(--muted)}
.rp-sec{margin-top:34px}
.rp-sec>.topline{margin-bottom:12px}
.rp-note{margin-top:8px}
.verdict{padding:20px 22px 0;border-left:4px solid var(--vc);overflow:hidden}
.verdict.ok{--vc:var(--t0)} .verdict.fixed{--vc:var(--t2)} .verdict.open{--vc:var(--red)} .verdict.pin{--vc:var(--t3)}
.vd-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.vd-crumb{font:500 12px var(--mono);letter-spacing:.04em;color:var(--muted)}
.vd-crumb i{font-style:normal;color:var(--faint);padding:0 8px}
.vd-t{margin-top:8px;font-size:30px;line-height:1.2;font-weight:500;letter-spacing:-.035em;color:var(--vc)}
.vd-why{margin:12px 0 0;padding:0;list-style:none}
.vd-why li{position:relative;padding:4px 0 4px 18px;font-size:14px;line-height:1.75;color:var(--ink)}
.vd-why li::before{content:"";position:absolute;left:2px;top:13px;width:8px;height:8px;border-radius:2px;background:var(--lc)}
.vd-why li.ok{--lc:var(--t0)} .vd-why li.fixed{--lc:var(--t2)} .vd-why li.open{--lc:var(--red)} .vd-why li.pin{--lc:var(--t3)}
.vd-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:18px -22px 0;border-top:1px solid var(--hair);background:var(--wash)}
.vd-stats>div{padding:13px 22px;border-left:1px solid var(--hair);min-width:0}
.vd-stats>div:first-child{border-left:0}
.vd-stats b{display:block;font:500 24px/1.2 var(--display);letter-spacing:-.03em}
.vd-stats b .spark{display:flex;margin:9px 0 6px;height:8px}
.vd-stats span{display:block;font:10.5px/1.6 var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtab{overflow:hidden}
.vt-r{display:grid;grid-template-columns:minmax(150px,1.15fr) minmax(110px,.9fr) 52px 104px 196px minmax(0,1.6fr);gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--hair);font-size:13px}
.vt-r.more{display:none}
.vt-h{border-top:0;background:var(--wash);font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.vt-r.core{background:color-mix(in srgb,var(--red) 3%,var(--paper))}
.vt-lib{font-weight:500;display:flex;gap:6px;align-items:center;min-width:0}
.vt-lib em{font:10px var(--mono);font-style:normal;padding:0 6px;border-radius:3px;background:var(--red-soft);color:var(--red)}
.vt-lib em.rt{background:var(--wash);color:var(--faint)}
.vt-r .mono{font-size:12px;overflow-wrap:anywhere}
.vt-r .dot{margin-right:6px}
.vt-iss{min-width:0;font-size:12.5px}
.vt-iss small{display:block;font:10.5px/1.5 var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt-more{display:block;padding:10px 16px;border-top:1px solid var(--hair);width:100%;text-align:left}
.vst{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid;font:500 11px/1.7 var(--mono);white-space:nowrap}
.vst.ok{color:var(--t0);border-color:color-mix(in srgb,var(--t0) 45%,transparent)}
.vst.fixed{color:var(--t2);border-color:color-mix(in srgb,var(--t2) 50%,transparent);background:color-mix(in srgb,var(--t2) 8%,transparent)}
.vst.open{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
.il{font-size:12.5px;text-align:left}
.recipe,.knobs{margin-top:12px;overflow:hidden}
.rc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--hair)}
.rc-k{font-size:19px;font-weight:500;letter-spacing:-.02em}
.rc-k i{font-style:normal;color:var(--faint);padding:0 4px}
.rc-s{margin-top:3px;font:11px/1.6 var(--mono);color:var(--muted)}
.rc-s .dot{margin:0 4px 0 2px}
.rc-a{display:flex;gap:8px;flex:none}
.rc-why{margin-top:6px;font-size:12px;line-height:1.7;color:var(--muted);max-width:70ch}
.rc-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.rc-col{padding:4px 20px 18px;min-width:0}
.rc-col+.rc-col{border-left:1px solid var(--hair)}
.rc-env{margin:0;padding:12px 14px;border-radius:6px;background:var(--wash);font:12px/1.85 var(--mono);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.rc-env .hl{color:var(--red);font-weight:600}
.rc-env .rt{color:var(--ink)}
.rc-set{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font:11.5px/1.6 var(--mono)}
.rc-set dt{color:var(--faint)} .rc-set dd{margin:0;overflow-wrap:anywhere}
.rc-list{margin:0;padding:0;list-style:none}
.rc-list li{position:relative;padding:4px 0 4px 16px;font-size:12.5px}
.rc-list li::before{content:"";position:absolute;left:2px;top:12px;width:7px;height:7px;border-radius:2px;background:var(--t2)}
.rc-list li.open::before{background:var(--red)}
.rc-alt{margin:0 20px 14px}
.kb-list{display:grid}
.kb-r{display:grid;grid-template-columns:minmax(120px,.8fr) minmax(0,1.6fr) 130px 168px;gap:12px;align-items:center;width:100%;padding:10px 20px;border-top:1px solid var(--hair);text-align:left;font-size:12.5px}
.kb-r:first-child{border-top:0}
.kb-r:hover{background:var(--wash)}
.kb-k{font-size:12px;font-weight:500;overflow-wrap:anywhere}
.kb-v{color:var(--muted);overflow-wrap:anywhere}
.kb-d{font:12px var(--mono)} .kb-d small{display:block;color:var(--faint);font-size:10px}
.kb-t{justify-self:end;padding:1px 8px;border-radius:999px;font:500 11px/1.7 var(--mono);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.kb-r.pin .kb-t{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
.kb-r.free .kb-t{color:var(--t0);border-color:color-mix(in srgb,var(--t0) 45%,transparent)}
.sjs{overflow:hidden}
.sj{display:grid;grid-template-columns:130px 64px 100px minmax(0,1fr);gap:14px;align-items:center;width:100%;padding:11px 18px;border-top:1px solid var(--hair);text-align:left}
.sj:first-child{border-top:0}
.sj:hover{background:var(--wash)}
.sj b{font-size:14px;font-weight:500}
.sj-n{font:11px var(--mono);color:var(--muted)}
.sj-w{min-width:0;font-size:13px}
.sj-w .dot{margin-right:7px}
.sj-w small{display:block;font:10.5px/1.5 var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recs{position:relative}
/* structured drawer pair bar + aligned six-column record rows */
.dw-pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch;margin-top:14px}
.dp-side{display:flex;align-items:flex-start;gap:9px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;line-height:1.45}
a.dp-side:hover{border-color:var(--ink)}
.dp-side>.dot{margin-top:5px}
.dp-side b{font-weight:500;color:var(--ink)}
.dp-side small{display:block;font:10.5px/1.5 var(--mono);color:var(--faint);margin-top:2px}
.dp-vs{align-self:center;font:13px var(--mono);color:var(--faint);padding:0 2px}
.trow{grid-template-columns:12px 172px minmax(0,1.15fr) 22px minmax(0,.92fr) 144px;gap:12px;align-items:start;min-height:58px;padding:11px 18px}
.trow.thead{align-items:center;min-height:0;padding:9px 18px}
.trow>.dot{margin-top:6px}
.c-item,.c-side{min-width:0}
.c-item b{display:block;font-size:13.5px;line-height:20px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-item small{display:block;margin-top:3px;font-size:11.5px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-line{display:flex;align-items:center;gap:6px;min-width:0;line-height:20px;font-size:13.5px;white-space:nowrap;overflow:hidden}
.cs-line>.dot{flex:none}
.cs-p{font-weight:500;color:var(--ink);flex:none}
.cs-m{color:var(--ink);overflow:hidden;text-overflow:ellipsis;min-width:0}
.cs-m.sep::before{content:"· ";color:var(--faint)}
.cs-dim{color:var(--muted);font-weight:400}
.cs-tag{flex:none;padding:0 6px;border:1px solid var(--line);border-radius:3px;background:var(--wash);font:500 10.5px/16px var(--mono);color:var(--ink)}
.cs-tag.same{border-style:dashed;background:transparent;color:var(--muted);font-weight:400}
.trow mark{background:color-mix(in srgb,var(--red) 18%,transparent);color:inherit;border-radius:2px}
.c-vs{font:12px/20px var(--mono);color:var(--faint);text-align:center;user-select:none}
.trow .c-sub{display:flex;flex-wrap:nowrap;align-items:center;gap:7px;margin-top:3px;line-height:16px;font-size:11.5px;white-space:nowrap;overflow:hidden}
.trow .c-sub>b{font-weight:500;flex:none}
.trow .c-sub .badge{flex:none;line-height:1.4;padding:0 6px;font-size:9.5px}
.trow .c-meta{font:10.5px/16px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;min-width:0}
.c-val b{line-height:20px}
.c-val small{margin-top:3px;line-height:16px}
.tbl.compact .trow{min-height:0;padding-top:7px;padding-bottom:7px;align-items:center}
.tbl.compact .trow>.dot{margin-top:0}
.tbl.compact .c-sub,.tbl.compact .c-item small,.tbl.compact .c-val small{display:none}
@media (max-width:860px){
  .st4{grid-template-columns:1fr;gap:8px;padding:12px 14px}
  .vd-t{font-size:24px}
  .vd-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vd-stats>div:nth-child(3){border-left:0}
  .vd-stats>div:nth-child(n+3){border-top:1px solid var(--hair)}
  .vt-h{display:none}
  .vt-r{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 14px}
  .vt-r>span:nth-child(3),.vt-r>span:nth-child(4){display:none}
  .vt-iss{grid-column:1/-1}
  .rc-b{grid-template-columns:1fr}
  .rc-col+.rc-col{border-left:0;border-top:1px solid var(--hair)}
  .rc-h{flex-direction:column}
  .kb-r{grid-template-columns:minmax(0,1fr) auto;padding:10px 14px}
  .kb-v{grid-column:1/-1;grid-row:2}
  .kb-d{display:none}
  .sj{grid-template-columns:minmax(0,1fr) auto;padding:11px 14px}
  .sj .minispark{display:none}
  .sj-w{grid-column:1/-1}
