<script>
"use strict";
function start(DATA) {
/* ======================================================================
   core — data preparation, helpers, router, drawer, tooltip, outline
   ====================================================================== */
const S = DATA.summary, ROWS = DATA.rows;
const REPAIRS = (DATA.repairs && DATA.repairs.repairs) || [];
const LIBGROUPS = (DATA.repairs && DATA.repairs.library_groups) || [];

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const byId = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtInt = n => Number(n).toLocaleString("en-US");
const SUPS = { "-": "⁻", "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹" };
const sup = n => String(n).split("").map(c => SUPS[c] || c).join("");
function fmtNum(v) {
  if (v == null || Number.isNaN(v)) return "—";
  if (v === 0) return "0";
  const a = Math.abs(v);
  if (Number.isInteger(v) && a < 1e7) return fmtInt(v);
  if (a >= 1e4 || a < 1e-4) return v.toExponential(2);
  if (a >= 100) return v.toFixed(1);
  if (a >= 1) return v.toFixed(3);
  return v.toPrecision(3);
}
function fmtFactor(f) {
  if (!isFinite(f) || f <= 0) return "—";
  if (f < 1000) return `${f < 10 ? f.toFixed(2) : f.toFixed(1)}×`;
  const e = Math.floor(Math.log10(f));
  return `${(f / 10 ** e).toFixed(1)}×10${sup(e)}`;
}
const pct = r => r == null ? "—" : `${Math.round(r * 100)}%`;
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const plural = (n, w) => `${fmtInt(n)} ${w}`;
const hashStr = t => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return Math.abs(h); };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

const TASK = { sft: "SFT", inference: "推理", rl: "RL" };
const STATUS = { completed: "完整", partial: "partial" };

/* ---------- metrics ---------- */
const MCOL = Object.fromEntries((S.metric_columns || []).map(m => [m.key, m]));
const HIGHER = new Set(Object.values(MCOL).filter(m => m.better === "higher").map(m => m.key));
/* Deviation from agreement, so one ordering and one log axis serve both directions. */
const devOf = (key, v) => v == null ? null : (HIGHER.has(key) ? 1 - v : Math.abs(v));
const PRIORITY = ["max_abs", "cosine", "nll_abs", "logprob_mae", "rmse", "l2", "top1"];
function headline(r) {
  for (const k of PRIORITY) if (r.metrics[k]) return { key: k, ...r.metrics[k] };
  const any = Object.entries(r.metrics)[0];
  return any ? { key: any[0], ...any[1] } : null;
}
const TIERS = [
  { key: "t0", label: "位级一致", long: "最大绝对误差为 0，或余弦相似度为 1" },
  { key: "t1", label: "≤1e-6", long: "单精度浮点舍入量级" },
  { key: "t2", label: "≤1e-3", long: "BF16 / FP16 低精度量级" },
  { key: "t3", label: "≤1", long: "可观测数值偏离" },
  { key: "t4", label: ">1", long: "显著偏离" },
];
function tierIndex(r) {
  const ma = r.metrics.max_abs?.value, cos = r.metrics.cosine?.value;
  if (ma == null && cos == null) return null;
  if (ma === 0 || cos === 1) return 0;
  if ((ma != null && ma < 1e-6) || (cos != null && cos >= 0.999999)) return 1;
  if ((ma != null && ma < 1e-3) || (cos != null && cos >= 0.999)) return 2;
  if (ma != null && ma >= 1) return 4;
  return 3;
}
const tierColor = i => i == null ? "var(--none)" : `var(--${TIERS[i].key})`;
const tierLabel = i => i == null ? "未分级" : TIERS[i].label;
/* Shared log axis for every deviation mark on the site. */
const LOG_LO = -16, LOG_HI = 2;
const logPos = d => d <= 0 ? 0 : 6 + (Math.min(LOG_HI, Math.max(LOG_LO, Math.log10(d))) - LOG_LO) / (LOG_HI - LOG_LO) * 94;

/* ---------- platforms ---------- */
const famOf = p => p.includes("Ascend") ? "acc" : (p.includes("NVIDIA") || p.includes("RTX")) ? "gpu" : "cpu";
const FAM = { acc: "NPU", gpu: "GPU", cpu: "CPU" };
const famColor = f => `var(--p-${f})`;
const PLATS = (S.platforms || []).map(([name, n]) => ({ name, n, fam: famOf(name) }));
const platHref = p => `#/platform/${encodeURIComponent(p)}`;
const pdot = p => `<i class="dot" style="background:${famColor(famOf(p))}" title="${FAM[famOf(p)]}"></i>`;

/* ---------- comparison kind ---------- */
const KINDS = {
  cross: { label: "NPU ↔ GPU", c: "var(--k-cross)" },
  cpuref: { label: "对 CPU 参考", c: "var(--k-cpu)" },
  same: { label: "同平台内", c: "var(--k-same)" },
  other: { label: "其它", c: "var(--k-other)" },
};
function kindOf(r) {
  const u = new Set(r.platforms), ps = [...u];
  if (ps.some(p => famOf(p) === "acc") && ps.some(p => famOf(p) === "gpu")) return "cross";
  if (ps.includes("CPU") && u.size > 1) return "cpuref";
  if (u.size <= 1) return "same";
  return "other";
}

/* ---------- rows ---------- */
const BYID = new Map();
ROWS.forEach(r => {
  let id = "c" + hashStr(r.eval_id + "|" + r.title + "|" + r.pair).toString(36);
  while (BYID.has(id)) id += "x";
  r.id = id; BYID.set(id, r);
  r.head = headline(r);
  r.tier = tierIndex(r);
  r.dev = r.head ? devOf(r.head.key, r.head.value) : null;
  r.kind = kindOf(r);
  r.uplats = [...new Set(r.platforms)];
  r.hay = [r.title, r.eval_title, r.model, r.pair, r.scope, r.subject, r.axis, TASK[r.task] || r.task, ...r.frameworks].join(" ").toLowerCase();
});
const EVALS = new Map();
for (const r of ROWS) {
  if (!EVALS.has(r.eval_id)) EVALS.set(r.eval_id, { id: r.eval_id, title: r.eval_title, model: r.model, date: r.date, task: r.task, rows: [] });
  const e = EVALS.get(r.eval_id); e.rows.push(r); if (String(r.date) > String(e.date)) e.date = r.date;
}
for (const e of EVALS.values()) {
  e.worst = e.rows.reduce((a, b) => ((b.dev ?? -1) > (a.dev ?? -1) ? b : a), e.rows[0]);
  e.partial = e.rows.some(r => r.status === "partial");
}

/* ---------- collections (curated questions; overlap on purpose) ---------- */
const has = (r, f) => r.platforms.some(p => famOf(p) === f);
const COLS = [
  { id: "npugpu", title: "NPU ↔ GPU 直接对比", short: "NPU↔GPU", desc: "昇腾 NPU 与 NVIDIA GPU 在同输入、同权重下直接对齐输出。", rule: "同时含 NPU 与 GPU、不含 CPU",
    test: r => has(r, "acc") && has(r, "gpu") && !r.platforms.includes("CPU") },
  { id: "cpuref", title: "对 CPU 独立参考", short: "对 CPU 参考", desc: "以独立 CPU 参考实现为基准，检验设备侧算子与路径的数值一致性。", rule: "含 CPU 且包含设备端平台",
    test: r => r.platforms.includes("CPU") && r.platforms.length > 1 },
  { id: "train", title: "训练：梯度与参数更新", short: "梯度与更新", desc: "反向传播梯度、优化器动量与单步权重更新的对齐程度。", rule: "比较对象为梯度或参数更新",
    test: r => ["gradient", "update"].includes(r.subject_key) },

  dev: ["偏离", "输出偏离完全一致的幅度。误差类指标取绝对值；余弦相似度与 Top-1 一致率取 1 − 值。全站图表共用同一对数刻度，精确为 0 的记录单独列于最左。"],

  bit: ["位级一致", "最大绝对误差精确为 0，或余弦相似度精确为 1，对应输出逐位一致。"],
  ungraded: ["未分级", "仅采集 NLL、logprob 等分布或标量指标、未采集最大绝对误差或余弦相似度的记录；原始读数照常展示。"],
  partial: ["partial", "采集或对齐未覆盖全部预定张量或步数。读数仅在已覆盖范围内成立，引用时请核对覆盖比例与备注。"],

  median: ["中位偏离", "该平台在当前比较对象下全部读数的偏离中位数，反映常规表现，受单一离群实验影响较小。"],
  lown: ["样本少", "该平台在此指标下的比较记录不足 3 条；读数正常展示，但不参与「最小偏离」标注。"],

  machine: ["降到机器精度", "修复后残差 ≤1e-5，收敛至浮点舍入噪声范围，已消除代码级偏差。"],
  partfix: ["部分收敛", "修复后误差量级显著下降但仍高于 1e-5，表明当前补丁之外仍存在其它数值分叉源。"],

const term = (key, text) => `<span class="term" tabindex="0" role="button" aria-label="${esc((GLOSS[key] || [key])[0])}：查看解释" data-term="${key}">${text ?? esc((GLOSS[key] || [key])[0])}</span>`;
let termEl = null;
function termTip(el) {
  const g = GLOSS[el.dataset.term]; if (!g) return;
  termEl = el;
  TIP.innerHTML = `<b>${esc(g[0])}</b><div class="tdef">${g[1]}</div>`;
  TIP.classList.add("on");
  const r = el.getBoundingClientRect(), w = TIP.offsetWidth, h = TIP.offsetHeight;
  TIP.style.left = Math.min(innerWidth - w - 8, Math.max(8, r.left - 6)) + "px";
  TIP.style.top = (r.bottom + h + 10 > innerHeight ? r.top - h - 8 : r.bottom + 8) + "px";
}
const termOff = () => { if (termEl) { termEl = null; hideTip(); } };
document.addEventListener("mouseover", e => { const t = e.target.closest && e.target.closest(".term"); if (t && t !== termEl) termTip(t); });
document.addEventListener("mouseout", e => { const t = e.target.closest && e.target.closest(".term"); if (t && !t.contains(e.relatedTarget)) termOff(); });
document.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("term")) termTip(e.target); });
document.addEventListener("focusout", e => { if (e.target.classList && e.target.classList.contains("term")) termOff(); });
document.addEventListener("click", e => {
  const t = e.target.closest && e.target.closest(".term");
  if (t) { e.preventDefault(); termEl === t && TIP.classList.contains("on") ? termOff() : termTip(t); } else termOff();
});
addEventListener("scroll", termOff, { passive: true });
byId("dwBody").addEventListener("scroll", termOff, { passive: true });

/* ---------- evidence card: question, red answer, conditions, figure,
   one-line takeaway, method folded away (inference-rsi's figure frame) ---------- */
/* Long notes and check lists fold behind a one-line preview (inference-rsi keeps
   method detail in <details>); short ones stay open. */
function foldList(items, what, limit = 200) {
  const xs = (items || []).map(x => typeof x === "string" ? x : JSON.stringify(x));
  if (!xs.length) return "";
  const lis = `<ul class="notes">${xs.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`;
  const total = xs.reduce((a, b) => a + b.length, 0);
  if (xs.length <= 2 && total <= limit) return lis;
  return `<details class="fold"><summary><span class="fl"><b class="c">展开 ${xs.length} 条${what}</b><b class="o">收起</b></span><span class="fp">${esc(trunc(xs[0], 70))}</span></summary>${lis}</details>`;
}
function evCard(o) {
  return `<article class="panel evcard"${o.id ? ` id="${o.id}"` : ""}>
    <header class="ev-h"><h3 class="ev-q">${o.q}</h3><p class="ev-a"${o.aid ? ` id="${o.aid}"` : ""}>${o.a || ""}</p>${o.meta != null ? `<p class="ev-meta"${o.mid ? ` id="${o.mid}"` : ""}>${o.meta}</p>` : ""}</header>
    <div class="ev-body">${o.body}</div>
    <p class="ev-take"${o.tid ? ` id="${o.tid}"` : ""}${o.take || o.tid ? "" : " hidden"}>${o.take || ""}</p>
    ${o.how ? `<details class="ev-how"><summary>${o.howLabel || "测量口径与说明"}</summary><div class="ev-how-b">${o.how}</div></details>` : ""}
  </article>`;
}
const trunc = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };

/* ---------- shared row renderer (list, platform page) ---------- */
function hl(text, q) {
  const t = esc(text);
  if (!q) return t;
  const words = q.split(/\s+/).filter(w => w.length > 0).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!words.length) return t;
  return t.replace(new RegExp(`(${words.join("|")})`, "gi"), "<mark>$1</mark>");
}
function rowHtml(r, q = "", selId = null) {
  const h = r.head, cov = r.coverage || {};
  const tags = [`<span class="tag">${hl(r.eval_title, q)}</span>`, `<span class="tag">${TASK[r.task] || esc(r.task)}</span>`,
    r.subject !== "未分类" ? `<span class="tag">${esc(r.subject)}</span>` : "",
    r.axis !== "未分类" ? `<span class="tag">${esc(r.axis)}</span>` : "",
    r.frameworks.length ? `<span class="tag">${esc(r.frameworks.slice(0, 3).join(" / "))}</span>` : ""].join("");
  return `<button class="trow${r.id === selId ? " sel" : ""}" data-id="${r.id}" type="button">
    <i class="dot" style="background:${tierColor(r.tier)}" title="${tierLabel(r.tier)}"></i>
    <span class="c-main"><span class="c-title">${hl(r.title, q)}${r.status === "partial" ? ` <span class="badge warn" style="margin-left:4px">partial</span>` : ""}</span><span class="c-sub">${tags}</span></span>
    <span class="c-pair" title="${esc(r.pair)}">${hl(r.pair, q)}</span>
    <span class="c-val">${h ? `<b>${fmtNum(h.value)}</b><small title="${esc(h.label)}">${esc(MCOL[h.key]?.label || h.label)}</small>` : `<b style="color:var(--faint)">—</b><small>无标量指标</small>`}</span>
    <span class="c-cov">${cov.ratio == null ? "—" : pct(cov.ratio)}${cov.ratio == null ? "" : `<span class="covbar"><i style="width:${Math.round(cov.ratio * 100)}%"></i></span>`}</span>
    <span class="c-date">${esc(r.date)}</span>

}

/* ---------- csv ---------- */
function exportRowsCsv(rows, name) {
  downloadCsv(name, ["eval_id", "evaluation", "comparison", "pair", "kind", "task", "subject", "axis", "tier", "headline_metric", "value", "coverage", "status", "date"],
    rows.map(r => [r.eval_id, r.eval_title, r.title, r.pair, KINDS[r.kind].label, r.task, r.subject, r.axis, tierLabel(r.tier), r.head?.label, r.head?.value, r.coverage?.ratio, r.status, r.date]));
}
function downloadCsv(name, header, rows) {
  const body = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(","));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + [header.join(","), ...body].join("\n")], { type: "text/csv;charset=utf-8" }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 500);
}

function renderSwarm() {
  const cols = (S.metric_columns || []).filter(m => m.count);
  const L = 50, R = 10, T = 14, B = 52, W = 1000, H = 380;
  const plotH = H - T - B, zoneH = 32, logH = plotH - zoneH;
  const colW = (W - L - R) / cols.length, rad = 3;
  const lo = -16, hi = 1;
  const yLog = d => T + (1 - (Math.max(lo, Math.min(hi, Math.log10(d))) - lo) / (hi - lo)) * logH;
  const zeroY = T + logH + zoneH * .58;
  let g = "";
  for (const t of [-16, -12, -8, -4, 0]) {
    const y = yLog(10 ** t).toFixed(1);
    g += `<line class="gridl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="ax" x="${L - 8}" y="${y}" text-anchor="end" dominant-baseline="middle">10${sup(t)}</text>`;
  }
  const sepY = (T + logH + 5).toFixed(1);
  g += `<line class="sepl" x1="${L}" x2="${W - R}" y1="${sepY}" y2="${sepY}"/><text class="ax" x="${L - 8}" y="${zeroY}" text-anchor="end" dominant-baseline="middle">0</text>`;
  cols.forEach((m, ci) => {
    const cx = L + colW * (ci + .5), half = colW / 2 - 6;
    if (ci) g += `<line class="gridl" x1="${L + colW * ci}" x2="${L + colW * ci}" y1="${T}" y2="${H - B + 4}" stroke-dasharray="2 4"/>`;
    const pts = [];
    for (const r of ROWS) { const v = r.metrics[m.key]?.value; if (v != null) pts.push({ r, d: devOf(m.key, v) }); }
    const zeros = pts.filter(p => p.d <= 0), rest = pts.filter(p => p.d > 0).sort((a, b) => a.d - b.d);
    const bins = new Map();
    for (const p of rest) { p.y = yLog(p.d); const b = Math.round(p.y / (rad * 2.1)); if (!bins.has(b)) bins.set(b, []); bins.get(b).push(p); }
    for (const arr of bins.values()) {
      const span = 2 * half * .62, step = arr.length > 1 ? Math.min(rad * 2.1, span / (arr.length - 1)) : 0;
      arr.forEach((p, i) => { p.x = cx + Math.ceil(i / 2) * (i % 2 ? 1 : -1) * step; });
    }
    for (const p of zeros) {
      const hh = hashStr(p.r.id + m.key);
      p.x = cx + ((hh % 1000) / 1000 - .5) * 2 * half * .9;
      p.y = zeroY + (((hh >> 10) % 100) / 100 - .5) * zoneH * .5;
    }
    for (const p of [...rest, ...zeros]) {
      g += `<circle class="sw-pt${swMatch(p.r) ? "" : " dim"}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${rad}" fill="${KINDS[p.r.kind].c}" fill-opacity=".62" data-id="${p.r.id}" data-k="${m.key}"/>`;
    }
    const by = H - B + 20;
    g += `<text class="ax-col" x="${cx}" y="${by}" text-anchor="middle">${esc(m.label)}</text><text class="ax-sub" x="${cx}" y="${by + 15}" text-anchor="middle">${pts.length} 读数 · ${zeros.length} 一致</text>`;
  });
  const svg = byId("swarm");
  svg.innerHTML = g;
  svg.onmousemove = e => {
    const c = e.target.closest(".sw-pt");
    $$(".sw-pt.hot", svg).forEach(x => x !== c && x.classList.remove("hot"));
    if (!c) return hideTip();
    c.classList.add("hot");
    showTip(rowTip(BYID.get(c.dataset.id), c.dataset.k), e.clientX, e.clientY);
  };
  svg.onmouseleave = () => { hideTip(); $$(".sw-pt.hot", svg).forEach(x => x.classList.remove("hot")); };

function whitenCase() {
  const R = [-0.02, -0.01, -0.03, 0.80, 0, 0], M = [1, 1, 1, 1, 0, 0], GAMMA = 1, LAM = 0.95;
  const n = M.reduce((a, b) => a + b);
  const mean = R.reduce((a, x, i) => a + x * M[i], 0) / n;
  const varU = R.reduce((a, x, i) => a + M[i] * (x - mean) ** 2, 0) / n * n / (n - 1);
  const W = R.map(x => (x - mean) / Math.sqrt(varU + 1e-8) + mean);   // masked_whiten(shift_mean=False)
  const Wfix = W.map((x, i) => x * M[i]);                               // the one-line fix: re-mask
  const gae = rw => { const A = Array(rw.length).fill(0); let last = 0; for (let t = rw.length - 1; t >= 0; t--) { last = rw[t] + GAMMA * LAM * last; A[t] = last; } return A; };
  const Abug = gae(W), Afix = gae(Wfix);
  const dlt = Abug.map((a, i) => (M[i] ? Math.abs(a - Afix[i]) : 0)), dMax = Math.max(...dlt);
  return { R, M, W, Wfix, Abug, Afix, dlt, dMax, LAM };
}

function armCounts(scope) {

    const n = +el.dataset.n, t0 = performance.now();

      const h = rp.headline, f = facOf(rp);
      let trk = "";
      if (h) {
        const b = rposR(h.before), a = rposR(h.after);
        const cls = h.after === 0 ? " zero" : (h.better === "lower" && h.after > 1e-5 ? " part" : "");
        trk = `<i class="seg" style="left:${Math.min(a, b)}%;width:${Math.abs(b - a)}%;transform-origin:${b > a ? "right" : "left"}"></i><i class="pb" style="left:${b}%"></i><i class="pa${cls}" style="--a:${a}%;--b:${b}%"></i>`;
      }
      return `<button class="rrow${h ? "" : " bare"}${RS.sel === rp.id ? " sel" : ""}" type="button" data-rp="${esc(rp.id)}" title="${esc(rp.title)}">
        <span class="rlab"><b>${hl(rp.short, RS.q)}</b><small>${esc(rp.lib || "其它")} · ${esc(rp.date)}${rp.status !== "validated" ? " · 调查中" : ""}${h ? " · " + esc(h.label) : ""}</small></span>
        <span class="rtrk">${trk}</span><span class="rfac ${f.cls}">${f.text}</span></button>`;
    };
    body.innerHTML = `<div class="legend" style="margin:0 0 12px"><span><i class="dot" style="background:var(--none)"></i>修复前</span><span><i class="dot" style="background:var(--t0)"></i>修复后</span><span><i class="dot sq" style="background:var(--t0)"></i>${term("zero", "精确为 0")}</span><span><i class="dot" style="background:var(--t2)"></i>仍可观测</span><span style="color:var(--faint)">横轴为对数误差量级；点击任意条目查看代码定位与复验范围</span></div>
      <div class="panel rfig${repAnimDone ? " go" : ""}" style="--grad:linear-gradient(90deg,${stops.join(",")},transparent 100%)">
      <div class="rhead"><b>修复</b><div class="rticks"><i style="left:3.4%">0</i>${ticks.map((t, i) => `<i class="${i % 2 ? "thin" : ""}" style="left:${rposR(10 ** t)}%">10${sup(t)}</i>`).join("")}</div><b>${term("factor", "改善")}</b></div>
      ${groups.map(g => grpHead(g) + shown(g).map(row).join("") + more(g)).join("")}</div>`;
    let k = 0; $$("#rBody .rrow").forEach(r => r.style.setProperty("--i", Math.min(k++, 16)));
    armRepairMotion();
  }
  writeRepQuery();
}
function paintRepair(rp) {
  if (!rp) return;
  const h = rp.headline, v = rp.validation || {}, f = facOf(rp);
  byId("dwCrumb").textContent = `修复 · ${rp.lib || "其它"} · ${rp.date}`;
  const dl = pairs => `<dl class="rows-dl">${pairs.filter(([, x]) => x).map(([k, x, m]) => `<dt>${k}</dt><dd class="${m ? "m" : ""}">${x}</dd>`).join("")}</dl>`;
  const list = a => (a || []).length ? `<ul>${a.map(x => `<li>${esc(typeof x === "string" ? x : JSON.stringify(x))}</li>`).join("")}</ul>` : "";
  // Twin panels share one grid, so every reading lines up across the gap.
  const ms = (v.metrics || []).map(m => ({ ...m }));
  if (h && !ms.some(m => m.label === h.label)) ms.unshift({ label: h.label, unit: h.unit, before: h.before, after: h.after, better: h.better });
  const hi = h ? ms.findIndex(m => m.label === h.label) : -1;
  if (hi > 0) ms.unshift(ms.splice(hi, 1)[0]);
  const outG = R_GROUPS.find(g => g.id === rp.out);
  const facM = m => m.after === 0 ? "→ 0" : (m.before != null && m.after) ? fmtFactor((m.better || "lower") === "higher" ? m.after / m.before : m.before / m.after) : "—";
  const aCol = (m, i) => m.after === 0 ? "var(--t0)" : (rp.out === "partial" && i === 0) ? "var(--t2)" : "var(--t0)";
  const pairs = [
    [`<b>修复前</b><span class="chips2">${rp.cause?.category ? `<span class="chip2 bad">${esc(rp.cause.category).replace(/_/g, "_<wbr>")}</span>` : ""}</span>`,
     `<b>修复后</b><span class="chips2"><span class="chip2 good">${esc(outG.t)}</span><span class="chip2">${R_STATUS[rp.status] || esc(rp.status)}</span></span>`, "h"],
    [esc(rp.problem?.observed || rp.problem?.summary || ""), esc(rp.repair?.summary || ""), "s"],
    ...ms.map((m, i) => [
      `<small>${esc(m.label)}</small><strong>${fmtNum(m.before)}</strong><em>${esc(m.unit || " ")}</em>`,
      `<small>${esc(m.label)}</small><strong style="color:${aCol(m, i)}">${fmtNum(m.after)}</strong><em>${facM(m)}</em>`,
      "m" + (i === 0 && h ? " hd" : "")]),
  ];
  const twin = pairs.map(([b, a, cls], i) => {
    const end = i === pairs.length - 1 ? " end" : "";
    return `<div class="tw-c b ${cls}${end}">${b}</div><div class="tw-c a ${cls}${end}">${a}</div>`;
  }).join("");
  const acc = v.acceptance && typeof v.acceptance === "object" ? Object.entries(v.acceptance).map(([k, x]) => `<span>${esc(k)}</span><span>${esc(typeof x === "object" ? JSON.stringify(x) : x)}</span>`).join("") : "";
  const ev = (rp.evidence || []).filter(e => e.url && e.url !== "#").map(e => `<a href="https://satsuki2486441738.github.io/PrecisionRSI/${esc(e.url)}" target="_blank" rel="noopener">${esc(e.label || e.url)}<span>↗</span></a>`).join("");
  const env = rp.environment || {}, cov = v.coverage;
  byId("dwBody").innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:6px"><span class="badge">${esc(rp.lib || "其它")}</span><span class="badge ${rp.status === "validated" ? "ok" : "warn"}">${R_STATUS[rp.status] || esc(rp.status)}</span><span class="badge">${term({ zero: "zero", machine: "machine", partial: "partfix", qual: "qual" }[rp.out] || "factor", esc(outG.t))}</span></div>
    <h2 class="dw-title" id="dwTitle">${esc(rp.short)}</h2>
    <p class="dw-sub">${esc(rp.source || "")}${rp.problem?.location ? `　<span class="mono" style="font-size:11px;color:var(--faint)">${esc(rp.problem.location)}</span>` : ""}</p>
    <div class="dw-sec"><h4>修复前后 <span>${h ? `${term("factor", "改善")} ${f.text}` : term("qual")}</span></h4><div class="twin">${twin}</div></div>
    ${(rp.stages || []).length ? `<div class="dw-sec"><h4>验证路径 <span>${rp.stages.length} 步</span></h4><div class="stages">${rp.stages.map((s, i) => `<div class="stage"><span>${String(i + 1).padStart(2, "0")}</span><div><b>${esc(s.name)}</b><p>${esc(s.result)}</p></div></div>`).join("")}</div></div>` : ""}
    <div class="dw-sec"><h4>问题</h4>${dl([["现象", esc(rp.problem?.summary)], ["触发", esc(rp.problem?.trigger)], ["预期", esc(rp.problem?.expected)], ["位置", esc(rp.problem?.location), 1]])}</div>
    <div class="dw-sec"><h4>成因</h4>${dl([["成因", esc(typeof rp.cause === "string" ? rp.cause : rp.cause?.summary)], ["链路", (rp.cause?.components || []).map(esc).join("<br>"), 1], ["上游", esc(rp.repair?.upstream_status)], ["提交", esc(rp.repair?.commit), 1]])}</div>
    <div class="dw-sec"><h4>复验范围</h4>${dl([["范围", esc(v.scope)], ["覆盖", cov ? esc(`${fmtInt(cov.observed)} / ${fmtInt(cov.expected)} ${cov.unit || ""}`) : "", 1], ["检查", (v.checks || []).length ? foldList(v.checks, "检查", 160) : ""], ["未覆盖", list(v.remaining)]])}${acc ? `<div class="kv" style="margin-top:12px">${acc}</div>` : ""}</div>
    <div class="dw-sec"><h4>环境</h4>${dl([["模型", esc([rp.model?.name, rp.model?.revision].filter(Boolean).join(" · ")), 1], ["硬件", esc(env.hardware), 1], ["库", (env.libraries || []).map(l => esc(`${l.name} ${l.version || ""}`.trim())).join("<br>"), 1]])}</div>
    ${(rp.notes || []).length ? `<div class="dw-sec"><h4>备注 <span>${rp.notes.length} 条</span></h4>${foldList(rp.notes, "备注")}</div>` : ""}
    ${ev ? `<div class="dw-sec"><h4>证据</h4><div class="evlist">${ev}</div></div>` : ""}`;
  const link = `#/repairs?id=${encodeURIComponent(rp.id)}`;
  byId("dwFoot").innerHTML = `<span class="mono-note">${DW.idx + 1} / ${DW.order.length} · j / k 切换</span><span style="display:flex;gap:8px"><button class="btn sm" type="button" id="dwCopy">复制链接</button>${parseHash().name !== "repairs" ? `<a class="btn sm" href="${link}">在修复页定位 <span>→</span></a>` : ""}</span>`;
  byId("dwCopy").onclick = e => copyText(pageUrl(link), e.currentTarget);
}

/* ======================================================================
   global: keys, csv, theme, boot
   ====================================================================== */
addEventListener("keydown", e => {
  const typing = /input|textarea|select/i.test(e.target.tagName);
  if (e.key === "Escape") { if (isOpen()) { closeDrawer(); e.preventDefault(); } else if (typing) e.target.blur(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const name = parseHash().name;
  if (e.key === "/") { const q = byId(name === "repairs" ? "rQ" : "lQ"); if (q && !byId(VIEWS[name]).hidden) { e.preventDefault(); q.focus(); q.select(); } return; }
  if (isOpen()) {
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveDrawer(1); }
    if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveDrawer(-1); }
    return;
  }
  if (name === "list" && (e.key === "j" || e.key === "k" || e.key === "Enter")) {
    const rows = $$("#lTbl .trow[data-id]");
    if (!rows.length) return;
    if (e.key === "Enter") { if (LS.cursor >= 0) openFromList(rows[LS.cursor].dataset.id); return; }
    e.preventDefault();
    LS.cursor = Math.max(0, Math.min(rows.length - 1, LS.cursor + (e.key === "j" ? 1 : -1)));
    rows.forEach((r, i) => r.classList.toggle("cur", i === LS.cursor));
    rows[LS.cursor].scrollIntoView({ block: "nearest" }); rows[LS.cursor].focus({ preventScroll: true });
  }
});
byId("csv").onclick = () => {
  const name = parseHash().name;
  if (name === "repairs") {
    downloadCsv("numericforge-repairs.csv", ["id", "title", "library", "status", "outcome", "date", "headline", "before", "after", "factor", "location"],
      repView.map(r => [r.id, r.title, r.lib, r.status, r.out, r.date, r.headline?.label, r.headline?.before, r.headline?.after, r.factor === Infinity ? "inf" : r.factor, r.problem?.location]));
    return;
  }
  exportRowsCsv(listView, "numericforge-comparisons.csv");
};
function effectiveDark() { const t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function syncThemeMeta() { $('meta[name="theme-color"]').setAttribute("content", effectiveDark() ? "#0b0c0e" : "#f7f5f2"); }
byId("theme").onclick = () => {
  const next = effectiveDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("nf-theme", next); } catch (e) {}
  syncThemeMeta();
};
syncThemeMeta();
$$('a[href="#/cite"]').forEach(a => a.addEventListener("click", e => { if (location.hash === "#/cite") { e.preventDefault(); byId("cite")?.scrollIntoView({ behavior: "smooth", block: "start" }); } }));
byId("toTop").onclick = e => { e.preventDefault(); scrollTo({ top: 0, behavior: "smooth" }); };
byId("updated").textContent = S.updated_at ? `数据更新于 ${S.updated_at}` : "";
addEventListener("hashchange", route);
byId("boot").remove();
route();
}

/* The records are read from the site's own data files, so the board can never
   show a copy that has drifted from what the rest of the site serves. */
buildBoard("./data/").then(start).catch(err => {
  const el = document.getElementById("boot");
  if (el) el.innerHTML = "读取 <code>data/evaluations.json</code> 与 <code>data/repairs.json</code> 失败："
    + String((err && err.message) || err)
    + "。<br>若在本地打开，请用静态服务器访问（<code>python3 -m http.server</code>）；"
    + "<code>file://</code> 下浏览器不允许读取同目录文件。";
});
